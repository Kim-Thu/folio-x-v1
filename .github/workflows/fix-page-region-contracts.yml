name: Fix page region contracts

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tighten page region contracts
        shell: python
        run: |
          from pathlib import Path
          import json

          builder = Path('src/data/pages/getPageBuilderData.ts')
          text = builder.read_text()

          text = text.replace(
              'import type { PAdvertisementData } from "@/types/components/object/project/advertisement/PAdvertisement.types";\n',
              'import type { PAdvertisementData } from "@/types/components/object/project/advertisement/PAdvertisement.types";\nimport type { PCtaProps } from "@/types/components/object/project/cta/PCta.types";\nimport type { PHeroProps } from "@/types/components/object/project/hero/PHero.types";\nimport type { PPageHeaderProps } from "@/types/components/object/project/page-header/PPageHeader.types";\n'
          )

          text = text.replace(
              'type ArchiveSection = Extract<PageSectionData, { type: "archive" }>;\n',
              'type HeroSection = Extract<PageSectionData, { type: "hero" }>;\ntype PageHeaderSection = Extract<PageSectionData, { type: "page-header" }>;\ntype CtaSection = Extract<PageSectionData, { type: "cta" }>;\n\ntype ArchiveSection = Extract<PageSectionData, { type: "archive" }>;\n'
          )

          marker = '''const resolveSection = async (\n\tsection: PageSectionData,\n\tcontext: PageBuilderContext,\n): Promise<PageRegion> => {\n'''

          resolvers = '''const resolveHeroProps = (section: HeroSection): PHeroProps => {\n\tconst content = section.content;\n\tif (\n\t\ttypeof content.eyebrow !== "string" ||\n\t\t!Array.isArray(content.title) ||\n\t\ttypeof content.description !== "string" ||\n\t\t!content.image ||\n\t\t!content.actions\n\t) {\n\t\tthrow new Error(`Invalid hero content for section "${section.id}".`);\n\t}\n\n\tconst socialLinks = content.socialLinks?.map((link) => {\n\t\tif (!link.icon) {\n\t\t\tthrow new Error(`Hero social link in section "${section.id}" requires an icon.`);\n\t\t}\n\t\treturn { href: link.href, label: link.label, icon: link.icon };\n\t});\n\n\treturn {\n\t\ttemplate: section.template,\n\t\tdata: {\n\t\t\tid: content.id ?? section.id,\n\t\t\teyebrow: content.eyebrow,\n\t\t\ttitle: content.title,\n\t\t\taccent: content.accent,\n\t\t\tdescription: content.description,\n\t\t\tactions: content.actions,\n\t\t\tsocialLinks,\n\t\t\timage: content.image,\n\t\t\tscrollLabel: content.scrollLabel,\n\t\t},\n\t};\n};\n\nconst resolvePageHeaderProps = (section: PageHeaderSection): PPageHeaderProps => {\n\tconst content = section.content;\n\n\tswitch (section.template) {\n\t\tcase "split-media":\n\t\t\tif (\n\t\t\t\t!content.breadcrumb ||\n\t\t\t\t!Array.isArray(content.title) ||\n\t\t\t\ttypeof content.description !== "string"\n\t\t\t) {\n\t\t\t\tthrow new Error(`Invalid split-media page header content for section "${section.id}".`);\n\t\t\t}\n\t\t\treturn {\n\t\t\t\ttemplate: "split-media",\n\t\t\t\tdata: {\n\t\t\t\t\tbreadcrumb: content.breadcrumb,\n\t\t\t\t\ttitle: content.title,\n\t\t\t\t\tdescription: content.description,\n\t\t\t\t\timage: content.image,\n\t\t\t\t},\n\t\t\t};\n\n\t\tcase "split-benefits": {\n\t\t\tif (\n\t\t\t\ttypeof content.eyebrow !== "string" ||\n\t\t\t\ttypeof content.title !== "string" ||\n\t\t\t\ttypeof content.accent !== "string" ||\n\t\t\t\ttypeof content.description !== "string" ||\n\t\t\t\t!content.image\n\t\t\t) {\n\t\t\t\tthrow new Error(`Invalid split-benefits page header content for section "${section.id}".`);\n\t\t\t}\n\n\t\t\tconst benefits = content.benefits && "items" in content.benefits\n\t\t\t\t? content.benefits\n\t\t\t\t: undefined;\n\n\t\t\treturn {\n\t\t\t\ttemplate: "split-benefits",\n\t\t\t\tdata: {\n\t\t\t\t\tid: content.id ?? section.id,\n\t\t\t\t\teyebrow: content.eyebrow,\n\t\t\t\t\ttitle: content.title,\n\t\t\t\t\taccent: content.accent,\n\t\t\t\t\tdescription: content.description,\n\t\t\t\t\tbenefits,\n\t\t\t\t\timage: content.image,\n\t\t\t\t},\n\t\t\t};\n\t\t}\n\n\t\tcase "immersive":\n\t\t\tif (\n\t\t\t\ttypeof content.eyebrow !== "string" ||\n\t\t\t\ttypeof content.title !== "string" ||\n\t\t\t\ttypeof content.accent !== "string" ||\n\t\t\t\ttypeof content.description !== "string" ||\n\t\t\t\ttypeof content.actionsLabel !== "string" ||\n\t\t\t\t!content.actions ||\n\t\t\t\t!content.image ||\n\t\t\t\t!content.metrics\n\t\t\t) {\n\t\t\t\tthrow new Error(`Invalid immersive page header content for section "${section.id}".`);\n\t\t\t}\n\t\t\treturn {\n\t\t\t\ttemplate: "immersive",\n\t\t\t\tdata: {\n\t\t\t\t\tid: content.id ?? section.id,\n\t\t\t\t\teyebrow: content.eyebrow,\n\t\t\t\t\ttitle: content.title,\n\t\t\t\t\taccent: content.accent,\n\t\t\t\t\tdescription: content.description,\n\t\t\t\t\tactionsLabel: content.actionsLabel,\n\t\t\t\t\tactions: content.actions,\n\t\t\t\t\timage: content.image,\n\t\t\t\t\tquote: content.quote,\n\t\t\t\t\tquoteCredit: content.quoteCredit,\n\t\t\t\t\tmetrics: content.metrics,\n\t\t\t\t},\n\t\t\t};\n\t}\n};\n\nconst resolveCtaProps = (section: CtaSection): PCtaProps => {\n\tconst content = section.content;\n\tif (typeof content.title !== "string") {\n\t\tthrow new Error(`Invalid CTA title for section "${section.id}".`);\n\t}\n\n\tlet price: PCtaProps["data"]["price"];\n\tif (content.price) {\n\t\tif (typeof content.price.period !== "string") {\n\t\t\tthrow new Error(`CTA price in section "${section.id}" requires a period.`);\n\t\t}\n\t\tprice = {\n\t\t\tcurrent: content.price.current,\n\t\t\tperiod: content.price.period,\n\t\t\tprevious: content.price.previous,\n\t\t};\n\t}\n\n\treturn {\n\t\ttemplate: section.template,\n\t\tdata: {\n\t\t\tid: content.id ?? section.id,\n\t\t\ttitle: content.title,\n\t\t\tdescription: content.description,\n\t\t\taction: content.action\n\t\t\t\t? { href: content.action.href, label: content.action.label }\n\t\t\t\t: undefined,\n\t\t\tform: content.form,\n\t\t\timage: content.image,\n\t\t\tfeatures: content.features,\n\t\t\tprice,\n\t\t},\n\t};\n};\n\n'''

          if marker not in text:
              raise SystemExit('resolveSection marker not found')
          text = text.replace(marker, resolvers + marker)

          text = text.replace(
              'props: { template: section.template, data: section.content } as Extract<PageRegion, { component: "hero" }>["props"],',
              'props: resolveHeroProps(section),'
          )
          text = text.replace(
              'props: { template: section.template, data: section.content } as Extract<PageRegion, { component: "page-header" }>["props"],',
              'props: resolvePageHeaderProps(section),'
          )
          text = text.replace(
              'props: { template: section.template, data: section.content } as Extract<PageRegion, { component: "cta" }>["props"],',
              'props: resolveCtaProps(section),'
          )
          builder.write_text(text)

          types = Path('src/types/components/object/project/page-header/PPageHeader.types.ts')
          text = types.read_text()
          old = '''  benefits: {\n    items: CFeatureData[];\n  };'''
          new = '''  benefits?: {\n    items: CFeatureData[];\n  };'''
          if old not in text:
              raise SystemExit('split benefits type block not found')
          types.write_text(text.replace(old, new))

          dispatcher = Path('src/components/object/project/page-header/PPageHeader.astro')
          text = dispatcher.read_text()
          start = text.index('import type {\n\tPPageHeaderProps,')
          end = text.index('} from "@/types/components/object/project/page-header/PPageHeader.types";') + len('} from "@/types/components/object/project/page-header/PPageHeader.types";')
          text = text[:start] + 'import type { PPageHeaderProps } from "@/types/components/object/project/page-header/PPageHeader.types";' + text[end:]
          text = text.replace('const template = props.template ?? "split-media";\n', '')
          body_start = text.index('---\n\n{', text.index('const props')) + 4
          new_body = '''\n{\n\tprops.template === "editorial" && (\n\t\t<PageHeaderEditorial data={props.data} />\n\t)\n}\n{\n\tprops.template === "cover-summary" && (\n\t\t<PageHeaderCoverSummary data={props.data} />\n\t)\n}\n{\n\tprops.template === "immersive" && (\n\t\t<PageHeaderImmersive data={props.data} />\n\t)\n}\n{\n\tprops.template === "split-benefits" && (\n\t\t<PageHeaderSplitBenefits data={props.data} />\n\t)\n}\n{\n\tprops.template === "media-aside" && (\n\t\t<PageHeaderMediaAside data={props.data} />\n\t)\n}\n{\n\tprops.template === "slider-aside" && (\n\t\t<PageHeaderSliderAside data={props.data} />\n\t)\n}\n{\n\tprops.template === "gallery-summary" && (\n\t\t<PageHeaderGallerySummary data={props.data} />\n\t)\n}\n{\n\t(!props.template || props.template === "split-media") && (\n\t\t<PageHeaderSplitMedia data={props.data} />\n\t)\n}\n'''
          text = text[:body_start] + new_body
          dispatcher.write_text(text)

          labs = Path('src/content/pages/labs.json')
          data = json.loads(labs.read_text())
          lead = data['content']['sections'][0]
          if lead.get('template') != 'split-benefits':
              raise SystemExit('labs lead template changed')
          title = lead['content']['title']
          if title != ['Experiment. Innovate. Share']:
              raise SystemExit(f'unexpected labs title: {title!r}')
          lead['content']['title'] = 'Experiment. Innovate. Share'
          labs.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
      - name: Type check
        run: npm run check -- --minimum-log-level error
      - name: Build and audit
        run: npm run validate
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-page-region-contracts.yml
          git add src/data/pages/getPageBuilderData.ts src/types/components/object/project/page-header/PPageHeader.types.ts src/components/object/project/page-header/PPageHeader.astro src/content/pages/labs.json .github/workflows/fix-page-region-contracts.yml
          git commit -m "refactor: normalize page region contracts"
          git push --no-verify origin HEAD:agent/cms-content-migration
