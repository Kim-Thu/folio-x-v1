name: Normalize Lab resource card

on:
  push:
    branches:
      - agent/cms-content-migration
    paths:
      - .github/workflows/normalize-lab-resource-card.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove fixed resource item presentation from CMS
        run: |
          echo '' | base64 --decode > /tmp/normalize-lab-resource.py
          python /tmp/normalize-lab-resource.py

      - name: Validate production source
        run: npm run validate

      - name: Commit normalization and remove temporary workflow
        run: |
          rm .github/workflows/normalize-lab-resource-card.yml
          git add src/components/object/project/card/templates/CardIconPanel.astro src/content/globals/lab-detail.json src/content/lab-detail-settings-schema.ts public/admin/config.yml .github/workflows/normalize-lab-resource-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: normalize Lab resource card presentation"
          git push
