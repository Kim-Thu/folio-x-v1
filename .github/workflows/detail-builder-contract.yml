name: detail-builder-migration

on:
  push:
    branches: [agent/cms-content-migration]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/types/components/pages/builder/PageBuilder.types.ts')
          s = p.read_text()
          s = s.replace(
              'import type { PHeroProps } from "@/types/components/object/project/hero/PHero.types";\n',
              'import type { PHeroProps } from "@/types/components/object/project/hero/PHero.types";\nimport type { PLayoutProps } from "@/types/components/object/project/layout/PLayout.types";\n',
              1,
          )
          s = s.replace(
              'export interface PageBuilderProps {\n\tpage: PageEntryData;\n\tcontext?: PageBuilderContext;\n}\n',
              'export interface ResolvedPageData {\n\tlayout: PLayoutProps;\n\tregions: PageRegion[];\n}\n\nexport type PageBuilderProps =\n\t| { page: PageEntryData; context?: PageBuilderContext }\n\t| ResolvedPageData;\n',
              1,
          )
          p.write_text(s)

          p = Path('src/components/pages/builder/PageBuilder.astro')
          s = p.read_text()
          s = s.replace(
              'import LPage from "@/components/layout/LPage.astro";',
              'import PLayout from "@/components/object/project/layout/PLayout.astro";',
              1,
          )
          s = s.replace(
              'const regions: PageRegion[] = await Promise.all(props.page.content.sections.map(async (section): Promise<PageRegion> => {',
              'const regions: PageRegion[] = "regions" in props ? props.regions : await Promise.all(props.page.content.sections.map(async (section): Promise<PageRegion> => {',
              1,
          )
          s = s.replace(
              '}));\n---\n\n<LPage {...props.page.content.layout}>\n\t{regions.map((region) => <PageRegionView region={region} />)}\n</LPage>',
              '}));\nconst layout = "layout" in props ? props.layout : props.page.content.layout;\n---\n\n<PLayout {...layout}>\n\t{regions.map((region) => <PageRegionView region={region} />)}\n</PLayout>',
              1,
          )
          p.write_text(s)
          PY
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/types/components/pages/builder/PageBuilder.types.ts src/components/pages/builder/PageBuilder.astro
          git rm .github/workflows/detail-builder-contract.yml
          git commit -m 'refactor(builder): support resolved pages through PLayout'
          git push origin HEAD:agent/cms-content-migration
