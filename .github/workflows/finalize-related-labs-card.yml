# temporary migration workflow
name: Finalize Related Labs card

on:
  push:
    branches:
      - agent/cms-content-migration
    paths:
      - .github/workflows/finalize-related-labs-card.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply Related Labs migration
        run: node scripts/finalize-related-labs.mjs

      - name: Validate production source
        run: npm run validate

      - name: Commit migration and remove helpers
        run: |
          rm scripts/finalize-related-labs.mjs .github/workflows/finalize-related-labs-card.yml
          git add src/components/object/project/card/templates/CardMediaCaption.astro src/data/pages/getLabDetailPageData.ts src/content/globals/lab-detail.json src/content/lab-detail-settings-schema.ts public/admin/config.yml scripts/finalize-related-labs.mjs .github/workflows/finalize-related-labs-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: restore Related Labs card structure"
          git push
