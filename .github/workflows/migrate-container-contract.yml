name: Migrate container contract

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Migrate container contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/types/components/layout/LContainer.types.ts'): (
                  'export type LContainerSize = "site" | "content";',
                  'export type LContainerSize = "fluid" | "wide" | "boxed";',
              ),
              Path('src/components/layout/LContainer.astro'): (
                  'size = "site",',
                  'size = "wide",',
              ),
              Path('public/admin/config.yml'): (
                  'options: [site, content, none]',
                  'options: [fluid, wide, boxed, none]',
              ),
          }

          for path, (before, after) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if before not in text:
                  raise SystemExit(f'Missing expected contract in {path}: {before}')
              path.write_text(text.replace(before, after), encoding='utf-8')

          variants = Path('src/variants/components/layout/LContainer.variants.ts')
          text = variants.read_text(encoding='utf-8')
          before = '''export const containerSizeClasses: Record<LContainerSize, string> = {\n\tsite: "max-w-screen-2xl",\n\tcontent: "max-w-7xl",\n};'''
          after = '''export const containerSizeClasses: Record<LContainerSize, string> = {\n\tfluid: "max-w-none",\n\twide: "max-w-screen-2xl",\n\tboxed: "max-w-7xl",\n};'''
          if before not in text:
              raise SystemExit('Missing expected LContainer variant map')
          variants.write_text(text.replace(before, after), encoding='utf-8')

          schema_before = 'container: z.enum(["site", "content", "none"]),'
          schema_after = 'container: z.enum(["fluid", "wide", "boxed", "none"]),'
          schema_files = []
          for path in Path('src/content').rglob('*.ts'):
              text = path.read_text(encoding='utf-8')
              if schema_before in text:
                  path.write_text(text.replace(schema_before, schema_after), encoding='utf-8')
                  schema_files.append(str(path))

          if not schema_files:
              raise SystemExit('No content schema contained the legacy container enum')

          print('Updated container schemas:')
          for path in schema_files:
              print(path)

          for path in Path('src/content').rglob('*.json'):
              text = path.read_text(encoding='utf-8')
              updated = (
                  text.replace('"container": "site"', '"container": "wide"')
                      .replace('"container": "content"', '"container": "boxed"')
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          for path in Path('src').rglob('*.astro'):
              text = path.read_text(encoding='utf-8')
              updated = (
                  text.replace('container="site"', 'container="wide"')
                      .replace('container="content"', 'container="boxed"')
                      .replace('size="site"', 'size="wide"')
                      .replace('size="content"', 'size="boxed"')
                      .replace('=== "none" ? "site" :', '=== "none" ? "wide" :')
                      .replace('=== "none" ? "content" :', '=== "none" ? "boxed" :')
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify legacy container names are gone
        shell: bash
        run: |
          if grep -R -n -E '"container"[[:space:]]*:[[:space:]]*"(site|content)"|container=["'"'"'](site|content)["'"'"']|size=["'"'"'](site|content)["'"'"']|z\.enum\(\["site", "content", "none"\]\)|=== "none" \? "(site|content)" :' src public/admin/config.yml; then
            echo 'Legacy container naming remains.'
            exit 1
          fi

          grep -R -n -E 'max-w-[A-Za-z0-9_:/.-]+' src

      - name: Install dependencies
        run: npm ci

      - name: Check container contract
        shell: bash
        run: |
          set +e
          npm run check -- --minimum-log-level error 2>&1 | tee /tmp/astro-check.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -E 'LContainerSize|Invalid option: expected one of "site"\|"content"|container.*"site"|container.*"content"' /tmp/astro-check.log; then
            echo 'Container migration still has type/schema errors.'
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo 'Astro check still reports unrelated pre-existing diagnostics; container contract diagnostics are clear.'
          fi

      - name: Build migrated content
        run: npx astro build

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/migrate-container-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public/admin/config.yml .github/workflows/migrate-container-contract.yml
          git commit -m 'refactor: rename container size contract'
          git push --no-verify
