name: fix-blog-header-guard
on:
  push:
    branches: [agent/cms-content-migration]
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch PageBuilder
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/pages/builder/PageBuilder.astro')
          s = p.read_text()
          old = '''\t\t\t\tcardsHeader: {\n\t\t\t\t\tdata: { title: sidebar.featured.title },\n\t\t\t\t\tappearance: sidebar.featured.header.appearance as PSectionHeaderProps["appearance"],\n\t\t\t\t\theadingLevel: sidebar.featured.header.headingLevel as PSectionHeaderProps["headingLevel"],\n\t\t\t\t},'''
          new = '''\t\t\t\tcardsHeader: {\n\t\t\t\t\tdata: { title: sidebar.featured.title },\n\t\t\t\t\t...(sidebar.featured.header && {\n\t\t\t\t\t\tappearance: sidebar.featured.header.appearance as PSectionHeaderProps["appearance"],\n\t\t\t\t\t\theadingLevel: sidebar.featured.header.headingLevel as PSectionHeaderProps["headingLevel"],\n\t\t\t\t\t}),\n\t\t\t\t},'''
          if old not in s:
              raise SystemExit('featured header block not found')
          s = s.replace(old, new, 1)
          old = '''\t\t\t\theader: {\n\t\t\t\t\tdata: { title: result.title },\n\t\t\t\t\tappearance: result.header.appearance as PSectionHeaderProps["appearance"],\n\t\t\t\t\theadingLevel: result.header.headingLevel as PSectionHeaderProps["headingLevel"],\n\t\t\t\t},'''
          new = '''\t\t\t\theader: {\n\t\t\t\t\tdata: { title: result.title },\n\t\t\t\t\t...(result.header && {\n\t\t\t\t\t\tappearance: result.header.appearance as PSectionHeaderProps["appearance"],\n\t\t\t\t\t\theadingLevel: result.header.headingLevel as PSectionHeaderProps["headingLevel"],\n\t\t\t\t\t}),\n\t\t\t\t},'''
          if old not in s:
              raise SystemExit('result header block not found')
          p.write_text(s)
          PY
      - run: npm run validate
      - name: Commit cleanup
        run: |
          rm .github/workflows/fix-blog-header-guard.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/pages/builder/PageBuilder.astro .github/workflows/fix-blog-header-guard.yml
          git commit -m "fix(builder): tolerate missing blog header presentation"
          git push origin HEAD:agent/cms-content-migration
