name: Repair Related Labs Decap

on:
  push:
    branches:
      - agent/cms-content-migration
    paths:
      - .github/workflows/repair-related-labs-decap.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/repair-related-labs-decap.mjs
      - run: npm run validate
      - name: Commit final source
        run: |
          rm scripts/repair-related-labs-decap.mjs .github/workflows/repair-related-labs-decap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: repair Related Labs Decap contract"
          git push
