name: Validate refactor branch

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Remove temporary validation workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/validate-branch.yml
          git add .github/workflows/validate-branch.yml
          git commit -m "chore: remove temporary validation workflow"
          git push --no-verify origin HEAD:agent/cms-content-migration
