name: Fix JSON blog content

on:
  push:
    branches:
      - fix/114-json-blog-content

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/114-json-blog-content
          fetch-depth: 0

      - name: Restore JSON article contract
        shell: python
        run: |
          from pathlib import Path
          import html
          import json
          import re
          import unicodedata

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          path = "src/content.config.ts"
          text = read(path)
          text = text.replace(
              'const blog = defineCollection({ loader: glob({ base: "./src/content/blog", pattern: "*.md" }), schema: blogEntrySchema });',
              'const blog = defineCollection({ loader: glob({ base: "./src/content/blog", pattern: "*.json" }), schema: blogEntrySchema });',
          )
          write(path, text)

          path = "src/content/blog-schema.ts"
          text = read(path)
          if "  content: z.string().min(1)," not in text:
              text = text.replace(
                  "  imageAlt: z.string().min(1),\n});",
                  "  imageAlt: z.string().min(1),\n  content: z.string().min(1),\n});",
              )
          write(path, text)

          path = "src/types/components/object/project/article/PArticle.types.ts"
          text = read(path)
          text = text.replace('import type { render } from "astro:content";\n\n', "")
          text = text.replace('type RenderedMarkdownContent = Awaited<ReturnType<typeof render>>["Content"];\n\n', "")
          text = text.replace("\tcontent: RenderedMarkdownContent;", "\tcontent: string;")
          write(path, text)

          path = "src/components/object/project/article/templates/ArticleRichText.astro"
          write(path, '''---
          import type { PArticleRichTextProps } from "@/types/components/object/project/article/PArticle.types";
          import { articleRichTextClasses } from "@/variants/components/object/project/article/PArticle.variants";

          const { content } = Astro.props as PArticleRichTextProps;
          ---

          <article class={articleRichTextClasses} set:html={content} />
          '''.replace("          ", ""))

          path = "src/data/pages/getInsightDetailPageData.ts"
          text = read(path)
          text = text.replace('import { render } from "astro:content";\n', "")
          text = text.replace(
              "\tconst { Content, headings } = await render(entry);\n",
              "\tconst { content, tocItems } = normalizeArticleContent(entry.data.content);\n",
          )
          text = re.sub(
              r'\n\tconst tocItems = headings\n\t\t\.filter\(\(heading\) => heading\.depth === 2 \|\| heading\.depth === 3\)\n\t\t\.map\(\(heading\) => \(\{ label: heading\.text, href: `#\$\{heading\.slug\}` \}\)\);\n',
              "\n",
              text,
          )
          text = text.replace("\t\t\t\tcontent: Content,", "\t\t\t\tcontent,")

          helper = r'''function decodeHeadingText(value: string): string {
          	return value
          		.replace(/<[^>]+>/g, "")
          		.replace(/&amp;/g, "&")
          		.replace(/&lt;/g, "<")
          		.replace(/&gt;/g, ">")
          		.replace(/&quot;/g, '"')
          		.replace(/&#39;/g, "'")
          		.trim();
          }

          function createHeadingSlug(value: string): string {
          	return value
          		.normalize("NFD")
          		.replace(/[\u0300-\u036f]/g, "")
          		.toLowerCase()
          		.replace(/[^a-z0-9]+/g, "-")
          		.replace(/^-+|-+$/g, "") || "section";
          }

          function normalizeArticleContent(source: string): {
          	content: string;
          	tocItems: Array<{ label: string; href: string }>;
          } {
          	const usedIds = new Map<string, number>();
          	const tocItems: Array<{ label: string; href: string }> = [];

          	const content = source.replace(
          		/<h([23])([^>]*)>([\s\S]*?)<\/h\1>/gi,
          		(_match, level: string, rawAttributes: string, innerHtml: string) => {
          			const label = decodeHeadingText(innerHtml);
          			const existingId = rawAttributes.match(/\sid=(?:"([^"]+)"|'([^']+)')/i)?.slice(1).find(Boolean);
          			const baseId = existingId || createHeadingSlug(label);
          			const seen = usedIds.get(baseId) ?? 0;
          			usedIds.set(baseId, seen + 1);
          			const id = seen === 0 ? baseId : `${baseId}-${seen + 1}`;
          			const attributes = existingId
          				? rawAttributes.replace(/\sid=(?:"[^"]+"|'[^']+')/i, ` id="${id}"`)
          				: `${rawAttributes} id="${id}"`;

          			tocItems.push({ label, href: `#${id}` });
          			return `<h${level}${attributes}>${innerHtml}</h${level}>`;
          		},
          	);

          	return { content, tocItems };
          }

          '''.replace("          ", "")
          anchor = "export async function getInsightDetailPaths() {"
          if "function normalizeArticleContent" not in text:
              text = text.replace(anchor, helper + anchor)
          write(path, text)

          path = "public/admin/config.yml"
          text = read(path)
          old = '''  - name: blog
              label: Blog
              label_singular: Blog post
              folder: src/content/blog
              create: true
              extension: md
              format: frontmatter
              slug: "{{slug}}"
              identifier_field: slug
              summary: "{{title}} — {{category}}"
              fields:
                - { label: Order, name: order, widget: number, value_type: int, min: 1 }
                - { label: Reading minutes, name: readingMinutes, widget: number, value_type: int, min: 1 }
                - { label: Slug, name: slug, widget: string }
                - { label: Category, name: category, widget: string }
                - { label: Category slug, name: categorySlug, widget: string }
                - label: Tags
                  name: tags
                  widget: list
                  fields: *taxonomy_term_fields
                - { label: Title, name: title, widget: string }
                - { label: Excerpt, name: excerpt, widget: text }
                - { label: Published at, name: publishedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
                - { label: Author, name: author, widget: string }
                - { label: Cover image, name: image, widget: image }
                - { label: Image alt, name: imageAlt, widget: string }
                - { label: Content, name: body, widget: markdown }
          '''.replace("          ", "")
          new = '''  - name: blog
              label: Blog
              label_singular: Blog post
              folder: src/content/blog
              create: true
              extension: json
              format: json
              slug: "{{slug}}"
              identifier_field: slug
              summary: "{{title}} — {{category}}"
              fields:
                - { label: Order, name: order, widget: number, value_type: int, min: 1 }
                - { label: Reading minutes, name: readingMinutes, widget: number, value_type: int, min: 1 }
                - { label: Slug, name: slug, widget: string }
                - { label: Category, name: category, widget: string }
                - { label: Category slug, name: categorySlug, widget: string }
                - label: Tags
                  name: tags
                  widget: list
                  fields: *taxonomy_term_fields
                - { label: Title, name: title, widget: string }
                - { label: Excerpt, name: excerpt, widget: text }
                - { label: Published at, name: publishedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
                - { label: Author, name: author, widget: string }
                - { label: Cover image, name: image, widget: image }
                - { label: Image alt, name: imageAlt, widget: string }
                - { label: Content, name: content, widget: text }
          '''.replace("          ", "")
          if old not in text:
              raise RuntimeError("Blog CMS block not found")
          write(path, text.replace(old, new))

          source_path = Path("src/content/blog/ecommerce-promotion-automation.md")
          source = source_path.read_text(encoding="utf-8")
          parts = source.split("---", 2)
          if len(parts) != 3:
              raise RuntimeError("Unexpected article frontmatter")
          body = parts[2].strip()

          def slugify(value):
              normalized = unicodedata.normalize("NFD", value)
              normalized = "".join(ch for ch in normalized if unicodedata.category(ch) != "Mn")
              normalized = normalized.lower()
              normalized = re.sub(r"[^a-z0-9]+", "-", normalized).strip("-")
              return normalized or "section"

          def inline(value):
              value = html.escape(value, quote=False)
              return re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", value)

          lines = body.splitlines()
          output = []
          paragraph = []
          i = 0

          def flush_paragraph():
              if paragraph:
                  output.append(f"<p>{inline(' '.join(part.strip() for part in paragraph))}</p>")
                  paragraph.clear()

          while i < len(lines):
              stripped = lines[i].strip()

              if not stripped:
                  flush_paragraph()
                  i += 1
                  continue

              heading = re.match(r"^(#{2,3})\s+(.+)$", stripped)
              if heading:
                  flush_paragraph()
                  level = len(heading.group(1))
                  label = heading.group(2).strip()
                  output.append(f'<h{level} id="{slugify(label)}">{inline(label)}</h{level}>')
                  i += 1
                  continue

              image = re.match(r"^!\[(.*?)\]\((.*?)\)$", stripped)
              if image:
                  flush_paragraph()
                  output.append(
                      f'<img src="{html.escape(image.group(2), quote=True)}" alt="{html.escape(image.group(1), quote=True)}" width="1400" height="900" loading="lazy" decoding="async">'
                  )
                  i += 1
                  continue

              if stripped.startswith("|"):
                  flush_paragraph()
                  table_lines = []
                  while i < len(lines) and lines[i].strip().startswith("|"):
                      table_lines.append(lines[i].strip())
                      i += 1
                  rows = [[cell.strip() for cell in row.strip("|").split("|")] for row in table_lines]
                  if len(rows) >= 2 and all(re.fullmatch(r":?-{3,}:?", cell.replace(" ", "")) for cell in rows[1]):
                      header_cells = rows[0]
                      body_rows = rows[2:]
                      table = ["<div class=\"article-table-scroll\"><table><thead><tr>"]
                      table.extend(f"<th>{inline(cell)}</th>" for cell in header_cells)
                      table.append("</tr></thead><tbody>")
                      for row in body_rows:
                          table.append("<tr>")
                          table.extend(f"<td>{inline(cell)}</td>" for cell in row)
                          table.append("</tr>")
                      table.append("</tbody></table></div>")
                      output.append("".join(table))
                  else:
                      output.extend(f"<p>{inline(row)}</p>" for row in table_lines)
                  continue

              if re.match(r"^-\s+", stripped):
                  flush_paragraph()
                  items = []
                  while i < len(lines) and re.match(r"^-\s+", lines[i].strip()):
                      items.append(re.sub(r"^-\s+", "", lines[i].strip()))
                      i += 1
                  output.append("<ul>" + "".join(f"<li>{inline(item)}</li>" for item in items) + "</ul>")
                  continue

              if re.match(r"^\d+\.\s+", stripped):
                  flush_paragraph()
                  items = []
                  while i < len(lines) and re.match(r"^\d+\.\s+", lines[i].strip()):
                      items.append(re.sub(r"^\d+\.\s+", "", lines[i].strip()))
                      i += 1
                  output.append("<ol>" + "".join(f"<li>{inline(item)}</li>" for item in items) + "</ol>")
                  continue

              paragraph.append(stripped)
              i += 1

          flush_paragraph()

          article = {
              "order": 1,
              "readingMinutes": 14,
              "slug": "ecommerce-promotion-automation",
              "category": "Case Studies",
              "categorySlug": "case-studies",
              "tags": [
                  {"label": "Automation", "slug": "automation"},
                  {"label": "E-commerce", "slug": "e-commerce"},
                  {"label": "Odoo", "slug": "odoo"},
                  {"label": "Workflow", "slug": "workflow"},
              ],
              "title": "E-commerce Promotion Automation: From 8 Hours to 15 Minutes",
              "excerpt": "A production case study on centralizing multi-store promotion setup, reducing repeated campaign work from about eight hours to about 15 minutes.",
              "publishedAt": "2026-09-03",
              "author": "Nguyễn Kim Thu",
              "image": "/uploads/ecommerce-promotion-automation-cover.svg",
              "imageAlt": "Four storefront workflows converging into one centralized promotion module, with setup time changing from about eight hours to about fifteen minutes",
              "content": "\n".join(output),
          }
          Path("src/content/blog/ecommerce-promotion-automation.json").write_text(
              json.dumps(article, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          source_path.unlink()

          Path(".github/workflows/fix-114-json-blog-content.yml").unlink()

      - name: Commit migrated contract
        run: |
          git config user.name "Kim-Thu"
          git config user.email "49784235+Kim-Thu@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore JSON blog content contract"
          git push origin HEAD:fix/114-json-blog-content
