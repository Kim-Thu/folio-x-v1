name: Migrate publication catalog into PageBuilder

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0

      - name: Apply catalog PageBuilder migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # CatalogPage becomes the same thin PageBuilder composition as other pages.
          catalog_page = root / 'src/components/pages/catalog/CatalogPage.astro'
          catalog_page.write_text('''---
          import PageBuilder from "@/components/pages/builder/PageBuilder.astro";
          import type { CatalogPageProps } from "@/types/components/pages/catalog/CatalogPage.types";

          const { data } = Astro.props as CatalogPageProps;
          ---

          <PageBuilder page={data.page} />
          '''.replace('          ', ''), encoding='utf-8')

          # CollectionRegion gains the already-approved `sidebar` structural template.
          collection_region = root / 'src/components/pages/builder/CollectionRegion.astro'
          collection_region.write_text('''---
          import LSidebar from "@/components/layout/LSidebar.astro";
          import CBox from "@/components/object/component/CBox.astro";
          import CButton from "@/components/object/component/CButton.astro";
          import CColumns from "@/components/object/component/CColumns.astro";
          import CGridItem from "@/components/object/component/CGridItem.astro";
          import CRow from "@/components/object/component/CRow.astro";
          import CTabList from "@/components/object/component/CTabList.astro";
          import PArchiveToolbar from "@/components/object/project/archive-toolbar/PArchiveToolbar.astro";
          import PCard from "@/components/object/project/card/PCard.astro";
          import PFilterPanel from "@/components/object/project/filter-panel/PFilterPanel.astro";
          import PSectionHeader from "@/components/object/project/section-header/PSectionHeader.astro";
          import PStatement from "@/components/object/project/statement/PStatement.astro";
          import type { PageCollectionRegion } from "@/types/components/pages/builder/PageCollectionRegion.types";

          type Props = { region: PageCollectionRegion };
          const { region } = Astro.props as Props;
          const props = region.props;
          ---

          {props.template === "sidebar" ? (
          	<CBox data-collection-filter-root>
          		<CColumns columns="one" gap="md">
          			{props.header && <PSectionHeader {...props.header} />}
          			<PArchiveToolbar {...props.toolbar} />

          			<LSidebar {...props.sidebar.layout}>
          				<CColumns slot="sidebar" columns="one" gap="md">
          					<CBox {...props.sidebar.panel}>
          						<PFilterPanel {...props.sidebar.filter} />
          					</CBox>

          					{props.sidebar.cardGroups.map((group) => (
          						<CBox {...(group.panel ?? props.sidebar.panel)}>
          							<CColumns columns="one" gap="sm">
          								{group.header && <PSectionHeader {...group.header} />}
          								<PCard {...group.cards} />
          							</CColumns>
          						</CBox>
          					))}
          				</CColumns>

          				<CColumns columns="one" gap="lg">
          					{props.cardGroups.map((group) => (
          						group.panel ? (
          							<CBox {...group.panel}>
          								<CColumns columns="one" gap="sm">
          									{group.header && <PSectionHeader {...group.header} />}
          									<PCard {...group.cards} />
          								</CColumns>
          							</CBox>
          						) : (
          							<CColumns columns="one" gap="sm">
          								{group.header && <PSectionHeader {...group.header} />}
          								<PCard {...group.cards} />
          							</CColumns>
          						)
          					))}
          				</CColumns>
          			</LSidebar>
          		</CColumns>
          	</CBox>
          ) : (
          	<CColumns
          		columns="one"
          		gap="xl"
          		data-tabbed-collection={props.behavior === "tabbed" ? "" : undefined}
          	>
          		{props.header && <PSectionHeader {...props.header} />}
          		{props.tabs && <CTabList {...props.tabs} />}

          		<CColumns
          			columns={props.template === "split" ? "twelve" : "one"}
          			gap="xl"
          			data-collection-panel={props.behavior === "tabbed" ? "" : undefined}
          		>
          			{props.cardGroups.map((cards, index) => (
          				<CGridItem lgSpan={props.template === "split" ? (index === 0 ? 7 : 5) : "full"}>
          					<PCard {...cards} />
          				</CGridItem>
          			))}
          		</CColumns>

          		{props.statement && <PStatement {...props.statement} />}

          		{props.action && (
          			<CRow>
          				<CButton {...props.action} />
          			</CRow>
          		)}
          	</CColumns>
          )}
          '''.replace('          ', ''), encoding='utf-8')

          # Region contract mirrors the actual existing catalog composition contract.
          region_types = root / 'src/types/components/pages/builder/PageCollectionRegion.types.ts'
          region_types.write_text('''import type { LSidebarProps } from "@/types/components/layout/LSidebar.types";
          import type { CBoxProps } from "@/types/components/object/component/CBox.types";
          import type { CButtonLinkProps } from "@/types/components/object/component/CButton.types";
          import type { CTabListProps } from "@/types/components/object/component/CTabList.types";
          import type { PArchiveToolbarProps } from "@/types/components/object/project/archive-toolbar/PArchiveToolbar.types";
          import type { PCardProps } from "@/types/components/object/project/card/PCard.types";
          import type { PFilterPanelProps } from "@/types/components/object/project/filter-panel/PFilterPanel.types";
          import type { PSectionHeaderProps } from "@/types/components/object/project/section-header/PSectionHeader.types";
          import type { PStatementProps } from "@/types/components/object/project/statement/PStatement.types";
          import type { PageRegionBase } from "@/types/components/pages/builder/PageRegion.types";

          export interface PageCollectionCardGroup {
          	header?: PSectionHeaderProps;
          	cards: PCardProps;
          	panel?: Pick<CBoxProps, "surface" | "radius" | "spacing">;
          }

          interface PageCollectionSharedProps {
          	header?: PSectionHeaderProps;
          }

          interface PageCollectionStandardProps extends PageCollectionSharedProps {
          	template?: "stack" | "split";
          	tabs?: CTabListProps;
          	cardGroups: PCardProps[];
          	action?: CButtonLinkProps;
          	statement?: PStatementProps;
          	behavior?: "tabbed";
          }

          interface PageCollectionSidebarProps extends PageCollectionSharedProps {
          	template: "sidebar";
          	toolbar: PArchiveToolbarProps;
          	sidebar: {
          		layout: Pick<LSidebarProps, "label" | "position" | "sticky">;
          		panel: Pick<CBoxProps, "surface" | "radius" | "spacing">;
          		filter: PFilterPanelProps;
          		cardGroups: PageCollectionCardGroup[];
          	};
          	cardGroups: PageCollectionCardGroup[];
          }

          export type PageCollectionRegionProps =
          	| PageCollectionStandardProps
          	| PageCollectionSidebarProps;

          export interface PageCollectionRegion extends PageRegionBase {
          	component: "collection";
          	props: PageCollectionRegionProps;
          }
          '''.replace('          ', ''), encoding='utf-8')

          # Page data now declares the approved collection structural template and working same-page genre route.
          for catalog in ('comics', 'novels'):
              path = root / f'src/content/pages/{catalog}.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              section = next(item for item in data['content']['sections'] if item['id'] == 'catalog')
              section['template'] = 'sidebar'
              section['content']['itemPresentation']['routes']['categoryBase'] = f'/{catalog}?genre='
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Remove obsolete Popular Authors settings that no longer have a renderer.
          catalog_settings_path = root / 'src/content/globals/publication-catalog.json'
          catalog_settings = json.loads(catalog_settings_path.read_text(encoding='utf-8'))
          for key in ('popularAuthorsTitle', 'authorPlaceholder', 'authorLimit'):
              catalog_settings['sidebar'].pop(key, None)
          catalog_settings['main'].pop('authorWorksTemplate', None)
          catalog_settings_path.write_text(json.dumps(catalog_settings, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          schema_path = root / 'src/content/publication-catalog-settings-schema.ts'
          schema = schema_path.read_text(encoding='utf-8')
          schema = schema.replace('\n\t\tpopularAuthorsTitle: z.string().min(1),', '')
          schema = schema.replace('\n\t\tauthorPlaceholder: z.object({ src: z.string().min(1), width: z.number().int().positive(), height: z.number().int().positive() }),', '')
          schema = schema.replace('\n\t\tauthorLimit: z.number().int().positive(),', '')
          schema = schema.replace('\n\t\tauthorWorksTemplate: z.string().min(1),', '')
          schema_path.write_text(schema, encoding='utf-8')

          config_path = root / 'public/admin/config.yml'
          config = config_path.read_text(encoding='utf-8')
          config = config.replace('              - { label: Popular authors title, name: popularAuthorsTitle, widget: string }\n', '')
          author_block = '''              - label: Author placeholder
                name: authorPlaceholder
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Width, name: width, widget: number, value_type: int, min: 1 }
                  - { label: Height, name: height, widget: number, value_type: int, min: 1 }
'''
          config = config.replace(author_block, '')
          config = config.replace('              - { label: Author limit, name: authorLimit, widget: number, value_type: int, min: 1 }\n', '')
          config = config.replace('              - { label: Author works template, name: authorWorksTemplate, widget: string, hint: "Use {count} as the number placeholder" }\n', '')
          config_path.write_text(config, encoding='utf-8')

          # Move the former PublicationCatalogContent responsibilities into the collection resolver.
          builder_path = root / 'src/data/pages/getPageBuilderData.ts'
          builder = builder_path.read_text(encoding='utf-8')
          builder = builder.replace(
              '\tgetProductCategories,\n\tgetProducts,\n\tgetProjects,\n\tgetPublications,',
              '\tgetProductCategories,\n\tgetProducts,\n\tgetProjects,\n\tgetPublicationCatalogSettings,\n\tgetPublications,',
          )
          builder = builder.replace(
              'import type { PAdvertisementData } from "@/types/components/object/project/advertisement/PAdvertisement.types";',
              'import type { CIconName } from "@/types/components/object/component/CIcon.types";\nimport type { PAdvertisementData } from "@/types/components/object/project/advertisement/PAdvertisement.types";',
          )
          builder = builder.replace(
              'import type { PageArchiveRegion } from "@/types/components/pages/builder/PageArchiveRegion.types";',
              'import type { PageArchiveRegion } from "@/types/components/pages/builder/PageArchiveRegion.types";\nimport type { PageCollectionRegion } from "@/types/components/pages/builder/PageCollectionRegion.types";',
          )

          marker = 'const archiveCards = (cards: CollectionSection["content"]["cards"], items: PCardData[]): PCardProps => ({'
          if marker not in builder:
              raise SystemExit('archiveCards marker not found')

          catalog_resolver = r'''
          type PublicationCatalogSettings = Awaited<ReturnType<typeof getPublicationCatalogSettings>>;

          const publicationCatalogCardProps = (
          	config: PublicationCatalogSettings["main"]["featuredCards"],
          	items: PCardData[],
          ): PCardProps => ({
          	template: config.template as PCardProps["template"],
          	layout: config.layout as PCardProps["layout"],
          	columns: cardColumns(config.columns),
          	gap: config.gap as PCardProps["gap"],
          	mediaRatio: config.mediaRatio as PCardProps["mediaRatio"],
          	slots: config.slots,
          	items,
          });

          const resolvePublicationCatalogCollection = async (
          	section: CollectionSection,
          ): Promise<PageCollectionRegion> => {
          	const content = section.content;
          	if (!("source" in content) || !(
          		isComicsCollectionContent(content) || isNovelsCollectionContent(content)
          	)) {
          		throw new Error(`Invalid publication catalog collection "${section.id}".`);
          	}

          	const catalog = content.source.collection;
          	const [allEntries, settings] = await Promise.all([
          		getPublications(catalog),
          		getPublicationCatalogSettings(),
          	]);
          	const entries = take(allEntries, content.source.limit);
          	const presentation = content.itemPresentation;
          	const cards: PCardData[] = entries.map((entry) => ({
          		href: `${presentation.routes.base}${entry.slug}`,
          		ariaLabel: `${presentation.ariaLabelPrefix}${entry.title}`,
          		title: [entry.title],
          		excerpt: entry.summary,
          		media: entry.cover,
          		metadata: {
          			items: entry.genres.map((genre) => ({
          				type: "category",
          				label: genre.label,
          				href: `${presentation.routes.categoryBase}${genre.slug}`,
          				display: presentation.categoryDisplay,
          			})),
          		},
          		tags: entry.genres.map((genre) => ({
          			label: genre.label,
          			href: `${presentation.routes.categoryBase}${genre.slug}`,
          		})),
          		tagsLabel: `${entry.title}${presentation.tagsLabelSuffix}`,
          		metrics: [{ icon: presentation.viewsIcon, label: entry.views }],
          		rating: { value: entry.rating },
          		facets: {
          			genre: entry.genres.map((genre) => genre.slug),
          			status: [entry.status],
          		},
          		searchValue: [
          			entry.title,
          			entry.summary,
          			entry.author,
          			...entry.genres.map((genre) => genre.label),
          		].join(" "),
          		sortValue: String(entry.order).padStart(4, "0"),
          	}));

          	const genreMap = new Map<string, { label: string; slug: string; count: number }>();
          	for (const entry of entries) {
          		for (const genre of entry.genres) {
          			const current = genreMap.get(genre.slug);
          			genreMap.set(genre.slug, {
          				label: genre.label,
          				slug: genre.slug,
          				count: (current?.count ?? 0) + 1,
          			});
          		}
          	}
          	const genres = [...genreMap.values()].sort((first, second) => second.count - first.count);
          	const genreIcons = settings.main.genreIcons as CIconName[];
          	const popularGenreCards: PCardData[] = genres
          		.slice(0, settings.main.popularGenresLimit)
          		.map((genre, index) => ({
          			href: `${presentation.routes.categoryBase}${genre.slug}`,
          			ariaLabel: genre.label,
          			title: [genre.label],
          			excerpt: settings.main.genreWorksTemplate.replace("{count}", String(genre.count)),
          			icon: genreIcons[index % genreIcons.length],
          		}));

          	const panel = {
          		surface: settings.sidebar.panel.surface as "glass",
          		radius: settings.sidebar.panel.radius as "md",
          		spacing: settings.sidebar.panel.spacing as "sm",
          	};
          	const compactHeader = (title: string) => ({
          		data: { title },
          		appearance: "compact" as const,
          		headingLevel: 2 as const,
          	});

          	return {
          		key: section.id,
          		component: "collection",
          		section: sectionFrame(section),
          		props: {
          			template: "sidebar",
          			header: sectionHeader(section),
          			toolbar: {
          				data: {
          					search: {
          						id: `${catalog}-search`,
          						label: settings.toolbar.searchLabel,
          						name: "search",
          						placeholder: settings.toolbar.searchPlaceholder,
          					},
          					selects: [
          						{
          							control: "genre",
          							id: `${catalog}-genre`,
          							label: settings.toolbar.genreLabel,
          							value: "all",
          							options: [
          								{ label: settings.toolbar.allGenresLabel, value: "all" },
          								...genres.map((genre) => ({ label: genre.label, value: genre.slug })),
          							],
          						},
          						{
          							control: "status",
          							id: `${catalog}-status`,
          							label: settings.toolbar.statusLabel,
          							value: "all",
          							options: [
          								{ label: settings.toolbar.allStatusesLabel, value: "all" },
          								{ label: settings.toolbar.ongoingLabel, value: "ongoing" },
          								{ label: settings.toolbar.completeLabel, value: "complete" },
          							],
          						},
          					],
          					sort: {
          						label: settings.toolbar.sortLabel,
          						value: settings.toolbar.sortValue,
          						options: settings.toolbar.sortOptions,
          					},
          					view: {
          						label: settings.toolbar.viewLabel,
          						gridLabel: settings.toolbar.gridViewLabel,
          						listLabel: settings.toolbar.listViewLabel,
          					},
          				},
          			},
          			sidebar: {
          				layout: {
          					label: settings.sidebar.labelTemplate.replace("{catalog}", catalog),
          					position: settings.sidebar.position,
          					sticky: settings.sidebar.sticky,
          				},
          				panel,
          				filter: {
          					data: {
          						groups: [{
          							appearance: "controls",
          							control: "genre",
          							legend: settings.sidebar.genresLegend,
          							name: `${catalog}-genres`,
          							type: "radio",
          							options: [
          								{
          									label: settings.sidebar.allGenresShortLabel,
          									value: "all",
          									count: entries.length,
          									checked: true,
          								},
          								...genres.map((genre) => ({
          									label: genre.label,
          									value: genre.slug,
          									count: genre.count,
          								})),
          							],
          						}],
          					},
          				},
          				cardGroups: [{
          					header: compactHeader(settings.sidebar.trendingTitle),
          					cards: publicationCatalogCardProps(
          						settings.sidebar.listCards,
          						cards.slice(0, settings.sidebar.trendingLimit),
          					),
          				}],
          			},
          			cardGroups: [
          				{
          					header: compactHeader(settings.main.featuredTitle),
          					cards: publicationCatalogCardProps(
          						settings.main.featuredCards,
          						cards.slice(0, settings.main.featuredLimit),
          					),
          				},
          				{
          					header: compactHeader(settings.main.latestTitle),
          					cards: publicationCatalogCardProps(
          						settings.main.latestCards,
          						cards.slice(0, settings.main.latestLimit),
          					),
          				},
          				{
          					header: compactHeader(settings.main.popularGenresTitle),
          					cards: publicationCatalogCardProps(settings.main.genreCards, popularGenreCards),
          					panel,
          				},
          			],
          		},
          	};
          };

          '''.replace('          ', '')
          builder = builder.replace(marker, catalog_resolver + marker)

          old_collection_case = '''\t\tcase "collection": {\n\t\t\tconst items = await resolveCollectionItems(section);\n\t\t\treturn {\n\t\t\t\tkey: section.id,\n\t\t\t\tcomponent: "collection",\n\t\t\t\tsection: frame,\n\t\t\t\tprops: {\n\t\t\t\t\ttemplate: section.template === "split" ? "split" : "stack",\n\t\t\t\t\theader: sectionHeader(section),\n\t\t\t\t\tcardGroups: [cardConfig(section, items)],\n\t\t\t\t},\n\t\t\t};\n\t\t}\n'''
          new_collection_case = '''\t\tcase "collection": {\n\t\t\tif (section.template === "sidebar") {\n\t\t\t\treturn resolvePublicationCatalogCollection(section);\n\t\t\t}\n\t\t\tconst items = await resolveCollectionItems(section);\n\t\t\treturn {\n\t\t\t\tkey: section.id,\n\t\t\t\tcomponent: "collection",\n\t\t\t\tsection: frame,\n\t\t\t\tprops: {\n\t\t\t\t\ttemplate: section.template === "split" ? "split" : "stack",\n\t\t\t\t\theader: sectionHeader(section),\n\t\t\t\t\tcardGroups: [cardConfig(section, items)],\n\t\t\t\t},\n\t\t\t};\n\t\t}\n'''
          if old_collection_case not in builder:
              raise SystemExit('collection case marker not found')
          builder = builder.replace(old_collection_case, new_collection_case)
          builder_path.write_text(builder, encoding='utf-8')

          # Old catalog mini-renderer is fully replaced.
          old_catalog_content = root / 'src/components/pages/catalog/PublicationCatalogContent.astro'
          if old_catalog_content.exists():
              old_catalog_content.unlink()
          PY

      - name: Commit migration
        run: |
          git config user.name "Kim-Thu"
          git config user.email "49784235+Kim-Thu@users.noreply.github.com"
          git add src public/admin/config.yml
          git commit -m "Unify publication catalogs with PageBuilder"
          git push origin HEAD:agent/cms-content-migration
