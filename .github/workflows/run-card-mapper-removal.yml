name: Run card mapper removal

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0
      - name: Apply source refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/remove-card-mapper.yml').read_text()
          start = workflow.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/remove_card_mapper.py').write_text(script)
          PY
          python /tmp/remove_card_mapper.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pages/getPageBuilderData.ts src/data/mappers/card.ts
          git commit -m "Remove card mapper layer"
          git push origin HEAD:agent/cms-content-migration
