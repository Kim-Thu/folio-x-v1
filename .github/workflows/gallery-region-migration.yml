name: gallery-region-migration

on:
  push:
    branches: [agent/cms-content-migration]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/types/components/pages/builder/PageBuilder.types.ts')
          s = p.read_text()
          marker = 'import type { PHeroProps } from "@/types/components/object/project/hero/PHero.types";\n'
          if 'PGalleryProps' not in s:
              s = s.replace(marker, marker + 'import type { PGalleryProps } from "@/types/components/object/project/gallery/PGallery.types";\n', 1)
          marker = 'export interface EntryIndexRegion extends PageRegionBase {\n'
          block = 'export interface GalleryRegion extends PageRegionBase {\n\tcomponent: "gallery";\n\tprops: PGalleryProps;\n}\n\n'
          if block not in s:
              s = s.replace(marker, block + marker, 1)
          s = s.replace('\t| TabsRegion\n\t| EntryIndexRegion', '\t| TabsRegion\n\t| GalleryRegion\n\t| EntryIndexRegion', 1)
          p.write_text(s)

          p = Path('src/components/pages/builder/PageRegionContent.astro')
          s = p.read_text()
          marker = 'import PHero from "@/components/object/project/hero/PHero.astro";\n'
          if 'PGallery.astro' not in s:
              s = s.replace(marker, marker + 'import PGallery from "@/components/object/project/gallery/PGallery.astro";\n', 1)
          marker = '{region.component === "tabs" && <CTabList {...region.props} />}\n'
          if 'region.component === "gallery"' not in s:
              s = s.replace(marker, marker + '\n{region.component === "gallery" && <PGallery {...region.props} />}\n', 1)
          p.write_text(s)
          PY
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/types/components/pages/builder/PageBuilder.types.ts src/components/pages/builder/PageRegionContent.astro
          git rm .github/workflows/gallery-region-migration.yml
          git commit -m 'feat(builder): register gallery region'
          git push origin HEAD:agent/cms-content-migration
