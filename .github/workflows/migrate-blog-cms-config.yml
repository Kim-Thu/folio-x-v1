name: Migrate blog CMS config

on:
  push:
    branches:
      - content/112-markdown-blog

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: content/112-markdown-blog
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Decap blog collection
        run: node .github/scripts/migrate-blog-cms-config.mjs
      - name: Commit CMS migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: switch blog CMS editor to markdown"
          git push origin HEAD:content/112-markdown-blog
