name: Fix mapper removal workflow

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0
      - name: Fix workflow and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/remove-card-mapper.yml')
          text = path.read_text()
          text = text.replace("    if: github.actor != 'github-actions[bot]'", "    if: ${{ github.actor != 'github-actions[bot]' }}")
          path.write_text(text)
          Path('.github/workflows/fix-remove-card-workflow.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/remove-card-mapper.yml .github/workflows/fix-remove-card-workflow.yml
          git commit -m "Fix card mapper removal workflow"
          git push origin HEAD:agent/cms-content-migration
