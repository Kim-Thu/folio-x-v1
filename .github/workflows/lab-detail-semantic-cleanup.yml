name: Lab Detail semantic cleanup

on:
  push:
    branches:
      - agent/cms-content-migration
    paths:
      - .github/workflows/lab-detail-semantic-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove Lab Detail presentation classes from Decap
        shell: python
        run: |
          from pathlib import Path

          path = Path("public/admin/config.yml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          removable_names = {
              "frameClass",
              "dividerClass",
              "gridClass",
              "linkClass",
              "imageClass",
              "captionClass",
              "iconClass",
              "class",
              "contentClass",
          }

          output = []
          in_lab_detail = False
          removed = 0

          for line in lines:
              stripped = line.strip()
              if stripped == "- name: lab_detail":
                  in_lab_detail = True
              elif in_lab_detail and stripped == "- name: publication_catalog":
                  in_lab_detail = False

              if in_lab_detail and any(f"name: {name}," in line for name in removable_names):
                  removed += 1
                  continue

              output.append(line)

          if removed != 13:
              raise SystemExit(f"Expected to remove 13 Lab Detail class fields from Decap config, removed {removed}")

          path.write_text("".join(output), encoding="utf-8")

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate final repository state
        run: npm run validate

      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/lab-detail-semantic-cleanup.yml
          git add public/admin/config.yml .github/workflows/lab-detail-semantic-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cms): finish Lab Detail semantic cleanup"
          git push
