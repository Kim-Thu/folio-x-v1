name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro check, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply shared schema cleanup
        run: |
          node scripts/cleanup-shared-schemas.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "src/content/schemas.ts";
          let source = await readFile(path, "utf8");
          source = source.replace('image: imageSchema.optional(), breadcrumb:', 'image: imageSchema.optional(), source: z.object({ collection: z.literal("blog") }).optional(), breadcrumb:');
          source = source.replace('benefits: z.object({ items: z.array(z.object({ label: z.string().min(1), icon: z.string().min(1) })).min(1) }).optional()', 'benefits: z.union([z.object({ items: z.array(z.object({ label: z.string().min(1), icon: z.string().min(1) })).min(1) }), z.object({ articleLabel: z.string().min(1), topicLabel: z.string().min(1), minuteLabel: z.string().min(1) })]).optional()');
          source = source.replace('z.enum(["callout", "default", "media-pricing"])', 'z.enum(["callout", "default", "media-pricing", "subscription"])');
          source = source.replace('price: z.object({ current: z.string().min(1), period: z.string().optional(), previous: z.string().optional() }).optional() }) });', 'price: z.object({ current: z.string().min(1), period: z.string().optional(), previous: z.string().optional() }).optional(), form: z.object({ formName: z.string().min(1), inputId: z.string().min(1), inputLabel: z.string().min(1), placeholder: z.string().min(1), submitLabel: z.string().min(1), tone: z.enum(["dark", "light"]).optional() }).optional() }) });');
          await writeFile(path, source, "utf8");
          NODE

      - name: Validate production source
        run: npm run validate

      - name: Commit schema cleanup
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- src/content/schemas.ts; then
            echo "No schema changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/schemas.ts
          git commit -m "tighten shared content schemas"
          git push
