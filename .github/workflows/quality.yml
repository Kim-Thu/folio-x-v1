name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro check, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Migrate Blog page Decap editor
        run: node scripts/add-blog-page-decap.mjs

      - name: Commit migrated Decap config
        shell: bash
        run: |
          if git diff --quiet -- public/admin/config.yml; then
            echo "No Decap migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin/config.yml
          git commit -m "chore(cms): migrate Blog page Decap editor"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Validate production source
        run: npm run validate
