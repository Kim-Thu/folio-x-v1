name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro check, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply shared schema cleanup
        run: node scripts/cleanup-shared-schemas.mjs

      - name: Validate production source
        run: npm run validate

      - name: Commit schema cleanup
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- src/content/schemas.ts; then
            echo "No schema changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/schemas.ts
          git commit -m "tighten shared content schemas"
          git push
