name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro check, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Migrate Decap Blog collection
        if: github.event_name == 'pull_request'
        run: |
          node scripts/migrate-decap-blog.mjs
          if git diff --quiet -- public/admin/config.yml; then
            echo "Decap Blog collection is already canonical"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/admin/config.yml
            git commit -m "add canonical Decap blog editor"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Validate production source
        run: npm run validate
