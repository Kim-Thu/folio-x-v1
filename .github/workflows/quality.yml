name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro check, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate audited lockfile
        run: npm audit fix --package-lock-only

      - name: Persist audited lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already audited"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix audited dependency lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Install audited dependencies
        run: npm ci

      - name: Validate production source
        run: npm run validate
