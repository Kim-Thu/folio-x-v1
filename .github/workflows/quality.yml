name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro check, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate audited lockfile
        run: npm audit fix --package-lock-only

      - name: Upload audited lockfile
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json

      - name: Install audited dependencies
        run: npm ci

      - name: Validate production source
        run: npm run validate
