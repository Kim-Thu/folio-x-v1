name: Remove generic page renderer

on:
  push:
    branches:
      - agent/ppage-template-fix-runner
    paths:
      - .github/workflows/restore-page-template-renderer.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0

      - name: Verify target checkpoint
        run: |
          test "$(git rev-parse HEAD)" = "aa8364701495b3c5b9b1eba4ef8b9f69d21d73be"

      - name: Apply PPage template ownership fix
        run: |
          set -euo pipefail
          git show origin/agent/ppage-template-fix-runner:.github/scripts/remove-generic-page-renderer.py > /tmp/remove-generic-page-renderer.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('/tmp/remove-generic-page-renderer.py')
          text = path.read_text()
          old = '{l})}}\n{k}</CColumns>\n{k}{{{var}.props.statement'
          new = '{l}))}}\n{k}</CColumns>\n{k}{{{var}.props.statement'
          if old not in text:
              raise SystemExit('Expected cardGroups closure not found in generator')
          path.write_text(text.replace(old, new))
          PY
          python3 /tmp/remove-generic-page-renderer.py

          test ! -d src/components/object/project/layout/parts
          test ! -d src/components/object/project/page/parts
          ! grep -R "LayoutRegion" -n src
          ! grep -R "LayoutRegionContent" -n src
          ! find src/components -name 'PageRegion.astro' -o -name 'PageRegionContent.astro' | grep .
          ! grep -R "PLayout\.astro" -n src/components/object/project/page src/components/pages/builder/PageBuilder.astro
          grep -q 'PageStacked from "@/components/object/project/page/templates/PageStacked.astro"' src/components/object/project/page/PPage.astro
          grep -q '<PageTemplate {regions} />' src/components/object/project/page/PPage.astro
          grep -q '<PPage template={pageTemplate} {regions} />' src/components/pages/builder/PageBuilder.astro

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run validate

      - name: Check diff
        run: git diff --check

      - name: Commit and push target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: render page templates directly"
          git push origin HEAD:agent/cms-content-migration
