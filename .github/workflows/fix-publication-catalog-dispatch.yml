name: Fix publication catalog dispatch

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
      - name: Patch collection dispatch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/data/pages/getPageBuilderData.ts")
          text = path.read_text()
          old = '''\t\tcase "collection": {\n\t\t\tif (section.template === "sidebar") {\n\t\t\t\treturn resolvePublicationCatalogCollection(section);\n\t\t\t}\n'''
          new = '''\t\tcase "collection": {\n\t\t\tif (\n\t\t\t\tsection.template === "sidebar" &&\n\t\t\t\t"source" in section.content &&\n\t\t\t\t(\n\t\t\t\t\tsection.content.source.collection === "comics" ||\n\t\t\t\t\tsection.content.source.collection === "novels"\n\t\t\t\t)\n\t\t\t) {\n\t\t\t\treturn resolvePublicationCatalogCollection(section);\n\t\t\t}\n'''
          if old not in text:
              print("Dispatch already patched or source changed; no write needed.")
          else:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pages/getPageBuilderData.ts
          git commit -m "fix: preserve generic sidebar collections"
          git push origin HEAD:agent/cms-content-migration
