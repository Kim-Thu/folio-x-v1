name: Restructure page architecture

on:
  push:
    branches:
      - agent/cms-content-migration
    paths:
      - scripts/restructure-page-architecture.py
      - scripts/fix-restructure-page-architecture.py
      - .github/workflows/restructure-page-architecture.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/fix-restructure-page-architecture.py
      - run: python scripts/restructure-page-architecture.py
      - run: npm ci
      - run: npm run check -- --minimum-log-level error
      - run: npm run build
      - name: Commit migrated architecture
        run: |
          rm -f .github/workflows/restructure-page-architecture.yml scripts/fix-restructure-page-architecture.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: restore page template architecture"
          git push origin HEAD:agent/cms-content-migration
