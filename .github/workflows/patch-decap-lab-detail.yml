name: Patch Decap Lab Detail

on:
  push:
    branches:
      - agent/cms-content-migration
    paths:
      - .github/workflows/patch-decap-lab-detail.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch Decap Lab Detail contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("public/admin/config.yml")
          content = path.read_text(encoding="utf-8")

          replacements = [
              (
                  """              - { label: Title, name: title, widget: string }\n              - { label: Open image label template, name: openImageLabelTemplate, widget: string }\n""",
                  """              - { label: Title, name: title, widget: string }\n              - { label: Template, name: template, widget: select, options: [grid, slider] }\n              - { label: Open image label template, name: openImageLabelTemplate, widget: string }\n""",
              ),
              (
                  """              - label: Header presentation\n                name: header\n                widget: object\n                fields:\n                  - { label: Appearance, name: appearance, widget: select, options: [default, compact] }\n                  - { label: Heading level, name: headingLevel, widget: number, value_type: int, min: 1, max: 6 }\n\n          - label: Related Labs\n""",
                  """              - label: Header presentation\n                name: header\n                widget: object\n                fields:\n                  - { label: Appearance, name: appearance, widget: select, options: [default, compact] }\n                  - { label: Heading level, name: headingLevel, widget: number, value_type: int, min: 1, max: 6 }\n              - label: Cards\n                name: cards\n                widget: object\n                fields:\n                  - { label: Template, name: template, widget: hidden, default: icon-panel }\n                  - { label: Layout, name: layout, widget: hidden, default: grid }\n                  - { label: Columns, name: columns, widget: hidden, default: 4 }\n                  - { label: Gap, name: gap, widget: select, options: [none, sm, md, lg, xl] }\n\n          - label: Related Labs\n""",
              ),
              (
                  """              - label: Header presentation\n                name: header\n                widget: object\n                fields:\n                  - { label: Appearance, name: appearance, widget: select, options: [default, compact] }\n                  - { label: Heading level, name: headingLevel, widget: number, value_type: int, min: 1, max: 6 }\n\n      - name: publication_catalog\n""",
                  """              - label: Header presentation\n                name: header\n                widget: object\n                fields:\n                  - { label: Appearance, name: appearance, widget: select, options: [default, compact] }\n                  - { label: Heading level, name: headingLevel, widget: number, value_type: int, min: 1, max: 6 }\n              - label: Cards\n                name: cards\n                widget: object\n                fields:\n                  - { label: Template, name: template, widget: hidden, default: media-caption }\n                  - { label: Layout, name: layout, widget: hidden, default: grid }\n                  - { label: Columns, name: columns, widget: hidden, default: 4 }\n                  - { label: Gap, name: gap, widget: select, options: [none, sm, md, lg, xl] }\n\n      - name: publication_catalog\n""",
              ),
          ]

          for old, new in replacements:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one Decap anchor, found {count}")
              content = content.replace(old, new, 1)

          path.write_text(content, encoding="utf-8")
          PY

      - run: npm ci
      - run: npm run validate

      - name: Commit synchronized Decap config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-decap-lab-detail.yml
          git add public/admin/config.yml
          git commit -m "Sync Decap Lab Detail contract"
          git push origin HEAD:agent/cms-content-migration
