name: CMS contract cleanup

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration

      - name: Normalize CMS contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path('src/content/products').glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              changed = False
              for section in data.get('detail', {}).get('page', {}).get('sections', []):
                  if section.get('type') == 'article' and 'template' in section:
                      section.pop('template')
                      changed = True
              if changed:
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          config_path = Path('public/admin/config.yml')
          text = config_path.read_text(encoding='utf-8')

          replacements = [
              ('- { label: Layout, name: layout, widget: string, required: false }',
               '- { label: Layout, name: layout, widget: select, required: false, options: [grid, list, three-column, twelve-column, content-three-column, mosaic, asymmetric, showcase] }'),
              ('- { label: Columns, name: columns, widget: number, required: false, value_type: int, min: 1 }',
               '- { label: Columns, name: columns, widget: number, required: false, value_type: int, min: 1, max: 5 }'),
              ('- { label: Gap, name: gap, widget: string, required: false }',
               '- { label: Gap, name: gap, widget: select, required: false, options: [none, sm, md, lg, xl] }'),
              ('- { label: Media ratio, name: mediaRatio, widget: string, required: false }',
               '- { label: Media ratio, name: mediaRatio, widget: select, required: false, options: [editorial, landscape, natural, panoramic, portrait, square, video] }'),
              ('- { label: Separator, name: separator, widget: string, required: false }',
               '- { label: Separator, name: separator, widget: select, required: false, options: [none, light, dark] }'),
              ('- { label: Variant, name: variant, widget: string, required: false }',
               '- { label: Variant, name: variant, widget: select, required: false, options: [primary, secondary, outline, ghost, text, text-subtle, pagination, tab, view] }'),
              ('- { label: Tone, name: tone, widget: string, required: false }',
               '- { label: Tone, name: tone, widget: select, required: false, options: [dark, light] }'),
              ('- { label: Size, name: size, widget: string, required: false }',
               '- { label: Size, name: size, widget: select, required: false, options: [xs, sm, md, lg] }'),
              ('- { label: Template, name: template, widget: string, required: false }',
               '- { label: Template, name: template, widget: select, required: false, options: [stacked, horizontal, overlay, featured, boxed, compact-media, compact-bordered, editorial, icon-panel, icon-summary, media-banner, media-caption, media-details, media-only, media-summary, media-metrics] }'),
              ('- { label: Layout, name: layout, widget: string }',
               '- { label: Layout, name: layout, widget: select, options: [grid, list, three-column, twelve-column, content-three-column, mosaic, asymmetric, showcase] }'),
              ('- { label: Columns, name: columns, widget: number, value_type: int, min: 1 }',
               '- { label: Columns, name: columns, widget: number, value_type: int, min: 1, max: 5 }'),
              ('- { label: Gap, name: gap, widget: string }',
               '- { label: Gap, name: gap, widget: select, options: [none, sm, md, lg, xl] }'),
              ('- { label: Appearance, name: appearance, widget: string }',
               '- { label: Appearance, name: appearance, widget: select, options: [default, compact, controls, navigation] }'),
              ('- { label: Metadata display, name: metadataDisplay, widget: string }',
               '- { label: Metadata display, name: metadataDisplay, widget: select, options: [icon, icon-text, text] }'),
          ]

          for old, new in replacements:
              text = text.replace(old, new)

          text = text.replace(
              '- { label: Template, name: template, widget: string }\n                          - label: Settings',
              '- { label: Template, name: template, widget: hidden, default: split-media }\n                          - label: Settings',
              1,
          )
          text = text.replace(
              '- { label: Template, name: template, widget: string, required: false }\n                          - label: Settings',
              '- { label: Template, name: template, widget: select, required: false, options: [sidebar, cards, split] }\n                          - label: Settings',
              1,
          )
          text = text.replace(
              '- { label: Template, name: template, widget: string }\n                          - label: Settings',
              '- { label: Template, name: template, widget: select, options: [callout, default, media-pricing, subscription] }\n                          - label: Settings',
              1,
          )

          config_path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup and remove migration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/products public/admin/config.yml
          git rm .github/workflows/cms-contract-cleanup.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(cms): normalize finite presentation contracts"
          git push origin HEAD:agent/cms-content-migration
