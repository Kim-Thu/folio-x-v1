name: Normalize structural page templates

on:
  push:
    branches:
      - agent/cms-content-migration
    paths:
      - scripts/normalize-page-template-names.py
      - .github/workflows/normalize-page-template-names.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/normalize-page-template-names.py
      - run: npm ci
      - run: npm run check -- --minimum-log-level error
      - run: npm run build
      - name: Commit normalized page templates
        run: |
          rm -f .github/workflows/normalize-page-template-names.yml scripts/normalize-page-template-names.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: normalize structural page template names"
          git push origin HEAD:agent/cms-content-migration
