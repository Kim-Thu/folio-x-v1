name: Finalize Related Labs card v2

on:
  push:
    branches:
      - agent/cms-content-migration
    paths:
      - .github/workflows/finalize-related-labs-card-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/finalize-related-labs.mjs
      - run: npm run validate
      - name: Commit final source
        run: |
          rm scripts/finalize-related-labs.mjs .github/workflows/finalize-related-labs-card.yml .github/workflows/finalize-related-labs-card-v2.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: restore Related Labs card structure"
          git push
