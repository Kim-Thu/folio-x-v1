name: Fix blog archive result header

on:
  push:
    branches:
      - agent/cms-content-migration
    paths:
      - scripts/fix-blog-archive-result-header.py
      - .github/workflows/fix-blog-archive-header.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/fix-blog-archive-result-header.py
      - run: npm ci
      - run: npm run check -- --minimum-log-level error
      - run: npm run build
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-blog-archive-header.yml scripts/fix-blog-archive-result-header.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support optional blog archive result header"
          git push origin HEAD:agent/cms-content-migration
