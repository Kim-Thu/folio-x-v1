          }
          for old, new in archive_replacements.items():
              if old not in text:
                  raise SystemExit(f'expected archive mapping not found: {old[:80]}')
              text = text.replace(old, new)

          if 'mapProductToCard' in text or 'mapProjectToCard' in text or 'mapLabToCard' in text or 'mapInsightToCard' in text or 'mapPublicationToCard' in text or '@/data/mappers/card' in text:
              raise SystemExit('mapper reference remains')

          path.write_text(text)
