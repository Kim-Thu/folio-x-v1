name: Remove dead reader template

on:
  push:
    branches:
      - agent/cms-content-migration
    paths:
      - .github/workflows/remove-dead-reader-template.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove dead reader template contract
        shell: python
        run: |
          import json
          from pathlib import Path

          settings_path = Path("src/content/globals/publication-detail.json")
          settings = json.loads(settings_path.read_text(encoding="utf-8"))
          reader = settings.get("reader")
          if not isinstance(reader, dict) or reader.get("template") != "reader":
              raise SystemExit("Expected reader.template = 'reader' before cleanup")
          del reader["template"]
          settings_path.write_text(
              json.dumps(settings, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          schema_path = Path("src/content/publication-detail-settings-schema.ts")
          schema = schema_path.read_text(encoding="utf-8")
          schema_old = '  reader: z.object({\n    template: z.literal("reader"),\n    settings: sectionSettingsSchema,'
          schema_new = '  reader: z.object({\n    settings: sectionSettingsSchema,'
          if schema_old not in schema:
              raise SystemExit("Reader template schema contract not found")
          schema_path.write_text(schema.replace(schema_old, schema_new, 1), encoding="utf-8")

          config_path = Path("public/admin/config.yml")
          config = config_path.read_text(encoding="utf-8")
          config_old = '''          - label: Reader\n            name: reader\n            widget: object\n            fields:\n              - { label: Template, name: template, widget: string }\n              - { label: Settings, name: settings, widget: object, fields: *publication_section_settings }'''
          config_new = '''          - label: Reader\n            name: reader\n            widget: object\n            fields:\n              - { label: Settings, name: settings, widget: object, fields: *publication_section_settings }'''
          if config_old not in config:
              raise SystemExit("Reader template Decap field not found")
          config_path.write_text(config.replace(config_old, config_new, 1), encoding="utf-8")

      - name: Validate production source
        run: npm run validate

      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/remove-dead-reader-template.yml
          git add src/content/globals/publication-detail.json src/content/publication-detail-settings-schema.ts public/admin/config.yml .github/workflows/remove-dead-reader-template.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: remove dead reader template setting"
          git push
