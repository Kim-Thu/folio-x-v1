name: Repair Decap JSON contract

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0

      - name: Repair Decap config
        run: python .github/scripts/repair_decap.py

      - name: Parse config YAML
        run: |
          ruby -e "require 'yaml'; YAML.load_file('public/admin/config.yml', aliases: true); puts 'config.yml YAML parse OK'"

      - name: Audit Decap config against JSON data
        run: ruby .github/scripts/audit_decap.rb

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run validate

      - name: Commit repair and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/audit-decap-contract.yml
          rm .github/scripts/repair_decap.py
          rm .github/scripts/audit_decap.rb
          git add public/admin/config.yml .github/workflows/audit-decap-contract.yml .github/scripts/repair_decap.py .github/scripts/audit_decap.rb
          git commit -m "fix: align Decap CMS with content contracts"
          git push --no-verify origin HEAD:agent/cms-content-migration
