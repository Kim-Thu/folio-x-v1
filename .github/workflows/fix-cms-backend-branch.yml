name: Fix CMS backend branch

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-content-migration
          fetch-depth: 0
      - name: Align Decap backend branch
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/admin/config.yml')
          text = path.read_text()
          old = 'backend:\n  name: github\n  repo: Kim-Thu/folio-x-v1\n  branch: main\n'
          new = 'backend:\n  name: github\n  repo: Kim-Thu/folio-x-v1\n  branch: agent/cms-content-migration\n'
          if old not in text:
              raise SystemExit('Expected Decap backend block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Verify CMS content source
        shell: python
        run: |
          from pathlib import Path
          text = Path('public/admin/config.yml').read_text()
          assert 'branch: agent/cms-content-migration' in text
          required = [
              'src/content/pages/home.json',
              'src/content/pages/blog.json',
              'src/content/globals/site.json',
              'src/content/globals/navigation.json',
          ]
          missing = [path for path in required if not Path(path).exists()]
          if missing:
              raise SystemExit('Missing CMS data files: ' + ', '.join(missing))
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-cms-backend-branch.yml
          git add public/admin/config.yml .github/workflows/fix-cms-backend-branch.yml
          git commit -m "fix: align Decap CMS backend branch"
          git push --no-verify origin HEAD:agent/cms-content-migration
