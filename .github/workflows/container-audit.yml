name: Container audit

on:
  push:
    branches:
      - agent/cms-content-migration

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize current page container usage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('src/content').rglob('*.json'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('"container": "content"', '"container": "site"')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated files:')
          for path in changed:
              print(path)
          PY

          echo '=== remaining content containers ==='
          if grep -R -n '"container"[[:space:]]*:[[:space:]]*"content"' src/content; then
            echo 'Unexpected content container remains.'
            exit 1
          fi

          echo '=== max width classes ==='
          grep -R -n -E 'max-w-[A-Za-z0-9_:/.-]+' src || true

          if git diff --quiet; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content
          git commit -m 'fix: align page section containers'
          git push
