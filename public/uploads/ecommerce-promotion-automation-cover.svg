<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Multi-store promotion setup centralized into one publishing workflow</title>
<desc id="desc">Four storefront nodes converge on a central promotion module, with the verified setup time changing from about eight hours to about fifteen minutes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12"/></filter>
</defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<circle cx="1260" cy="120" r="170" fill="#dcfce7" opacity="0.65"/>
<circle cx="130" cy="790" r="190" fill="#dbeafe" opacity="0.7"/>
<text x="110" y="115" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#334155" letter-spacing="2">E-COMMERCE WORKFLOW</text>
<text x="110" y="190" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#0f172a">Repeated setup → one controlled flow</text>
<text x="110" y="242" font-family="Arial, sans-serif" font-size="28" fill="#475569">Centralizing promotion management across multiple storefronts</text>
<g transform="translate(110 340)">
  <text x="0" y="-35" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#64748b">BEFORE</text>
  <g fill="#fff" stroke="#cbd5e1" stroke-width="3">
    <rect x="0" y="0" rx="24" width="220" height="120"/>
    <rect x="0" y="150" rx="24" width="220" height="120"/>
    <rect x="0" y="300" rx="24" width="220" height="120"/>
    <rect x="0" y="450" rx="24" width="220" height="120"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="110" y="72">Storefront 01</text><text x="110" y="222">Storefront 02</text><text x="110" y="372">Storefront 03</text><text x="110" y="522">Storefront 04</text>
  </g>
  <g stroke="#94a3b8" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M220 60 C330 60 340 285 455 285"/><path d="M220 210 C330 210 340 285 455 285"/><path d="M220 360 C330 360 340 285 455 285"/><path d="M220 510 C330 510 340 285 455 285"/>
  </g>
  <g filter="url(#shadow)"><rect x="455" y="160" width="360" height="250" rx="36" fill="#0f172a"/></g>
  <text x="635" y="225" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#93c5fd" text-anchor="middle">CENTRALIZED</text>
  <text x="635" y="278" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">Promotion module</text>
  <text x="635" y="325" font-family="Arial, sans-serif" font-size="23" fill="#cbd5e1" text-anchor="middle">Administration tool</text>
  <text x="635" y="366" font-family="Arial, sans-serif" font-size="21" fill="#94a3b8" text-anchor="middle">Validation • access control</text>
  <path d="M815 285 H965" stroke="#22c55e" stroke-width="9" stroke-linecap="round"/><path d="M940 258 L975 285 L940 312" fill="none" stroke="#22c55e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)"><rect x="995" y="190" width="250" height="190" rx="32" fill="#fff" stroke="#bbf7d0" stroke-width="4"/></g>
  <text x="1120" y="245" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#15803d" text-anchor="middle">AFTER</text>
  <text x="1120" y="300" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">Marketing publishes</text>
  <text x="1120" y="342" font-family="Arial, sans-serif" font-size="22" fill="#475569" text-anchor="middle">through one admin flow</text>
</g>
<g transform="translate(850 725)">
  <rect x="0" y="0" width="190" height="96" rx="24" fill="#fee2e2"/><text x="95" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b" text-anchor="middle">ABOUT 8 HOURS</text><text x="95" y="70" font-family="Arial, sans-serif" font-size="18" fill="#b91c1c" text-anchor="middle">repeated setup</text>
  <text x="225" y="59" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#64748b">→</text>
  <rect x="275" y="0" width="210" height="96" rx="24" fill="#dcfce7"/><text x="380" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534" text-anchor="middle">ABOUT 15 MINUTES</text><text x="380" y="70" font-family="Arial, sans-serif" font-size="18" fill="#15803d" text-anchor="middle">centralized setup</text>
</g>
</svg>
