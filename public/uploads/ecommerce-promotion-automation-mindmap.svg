<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Mindmap of the promotion automation case study</title>
<desc id="desc">A mindmap connecting the original repeated multi-store setup, the centralized promotion module, the surrounding Odoo and REST API integration context, and the resulting fifteen-minute marketing publishing workflow.</desc>
<rect width="1400" height="900" rx="32" fill="#f8fafc"/>
<text x="70" y="80" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Promotion automation mindmap</text>
<text x="70" y="120" font-family="Arial, sans-serif" font-size="21" fill="#64748b">Verified production facts in solid branches; generalized lessons are discussed separately in the article.</text>
<g stroke="#cbd5e1" stroke-width="5" fill="none" stroke-linecap="round">
  <path d="M700 450 C535 450 500 245 360 245"/><path d="M700 450 C535 450 500 655 360 655"/><path d="M700 450 C865 450 900 245 1040 245"/><path d="M700 450 C865 450 900 655 1040 655"/>
</g>
<rect x="535" y="360" width="330" height="180" rx="38" fill="#0f172a"/>
<text x="700" y="425" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#93c5fd" text-anchor="middle">CENTRAL CHANGE</text>
<text x="700" y="470" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">Promotion module</text>
<text x="700" y="512" font-family="Arial, sans-serif" font-size="21" fill="#cbd5e1" text-anchor="middle">One administration workflow</text>
<g>
  <rect x="90" y="150" width="320" height="190" rx="30" fill="#fee2e2" stroke="#fecaca" stroke-width="3"/>
  <text x="250" y="198" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#991b1b" text-anchor="middle">BEFORE</text>
  <text x="130" y="245" font-family="Arial, sans-serif" font-size="22" fill="#334155">• Multiple storefronts</text>
  <text x="130" y="282" font-family="Arial, sans-serif" font-size="22" fill="#334155">• Repeated campaign entry</text>
  <text x="130" y="319" font-family="Arial, sans-serif" font-size="22" fill="#334155">• About 8 hours</text>
  <rect x="90" y="565" width="320" height="190" rx="30" fill="#e0f2fe" stroke="#bae6fd" stroke-width="3"/>
  <text x="250" y="613" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#075985" text-anchor="middle">CONTROL</text>
  <text x="130" y="660" font-family="Arial, sans-serif" font-size="22" fill="#334155">• Administration tool</text>
  <text x="130" y="697" font-family="Arial, sans-serif" font-size="22" fill="#334155">• Validation</text>
  <text x="130" y="734" font-family="Arial, sans-serif" font-size="22" fill="#334155">• Access control</text>
  <rect x="990" y="150" width="320" height="190" rx="30" fill="#ede9fe" stroke="#ddd6fe" stroke-width="3"/>
  <text x="1150" y="198" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#5b21b6" text-anchor="middle">SYSTEM CONTEXT</text>
  <text x="1030" y="245" font-family="Arial, sans-serif" font-size="22" fill="#334155">• Odoo ERP</text>
  <text x="1030" y="282" font-family="Arial, sans-serif" font-size="22" fill="#334155">• REST APIs</text>
  <text x="1030" y="319" font-family="Arial, sans-serif" font-size="22" fill="#334155">• Stock, price, promo, orders</text>
  <rect x="990" y="565" width="320" height="190" rx="30" fill="#dcfce7" stroke="#bbf7d0" stroke-width="3"/>
  <text x="1150" y="613" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#166534" text-anchor="middle">AFTER</text>
  <text x="1030" y="660" font-family="Arial, sans-serif" font-size="22" fill="#334155">• Marketing can publish</text>
  <text x="1030" y="697" font-family="Arial, sans-serif" font-size="22" fill="#334155">• Centralized workflow</text>
  <text x="1030" y="734" font-family="Arial, sans-serif" font-size="22" fill="#334155">• About 15 minutes</text>
</g>
</svg>
