<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Folio X architecture map</title>
  <desc id="desc">Architecture map from CMS and schemas through PageBuilder, PPage templates and PageRegionContent into Project patterns, Components and Layouts, producing HTML enhanced by optional feature scripts.</desc>
  <rect width="1400" height="900" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="90" y="70" font-size="34" font-weight="700" fill="#121317">Architecture flow</text>
    <text x="90" y="104" font-size="20" fill="#65707f">Content describes intent. Code owns rendering.</text>

    <g font-size="22" font-weight="700" text-anchor="middle">
      <rect x="80" y="170" width="250" height="120" rx="20" fill="#121317"/>
      <text x="205" y="220" fill="#ffffff">CMS + JSON</text>
      <text x="205" y="252" font-size="18" font-weight="400" fill="#dce3eb">approved content choices</text>

      <rect x="410" y="170" width="250" height="120" rx="20" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/>
      <text x="535" y="220" fill="#121317">SCHEMAS</text>
      <text x="535" y="252" font-size="18" font-weight="400" fill="#5f6976">shape + validation</text>

      <rect x="740" y="170" width="250" height="120" rx="20" fill="#dcecff" stroke="#9dbfe8" stroke-width="2"/>
      <text x="865" y="220" fill="#163a63">PAGEBUILDER</text>
      <text x="865" y="252" font-size="18" font-weight="400" fill="#315d8c">normalize to contracts</text>

      <rect x="1070" y="170" width="250" height="120" rx="20" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/>
      <text x="1195" y="220" fill="#121317">PPAGE</text>
      <text x="1195" y="252" font-size="18" font-weight="400" fill="#5f6976">template selection</text>

      <rect x="905" y="390" width="290" height="120" rx="20" fill="#121317"/>
      <text x="1050" y="440" fill="#ffffff">PAGE REGION</text>
      <text x="1050" y="472" font-size="18" font-weight="400" fill="#dce3eb">typed dispatcher</text>

      <rect x="560" y="610" width="280" height="120" rx="20" fill="#dcecff" stroke="#9dbfe8" stroke-width="2"/>
      <text x="700" y="660" fill="#163a63">PROJECT PATTERNS</text>
      <text x="700" y="692" font-size="18" font-weight="400" fill="#315d8c">PCard · PGallery · PArticle …</text>

      <rect x="190" y="610" width="260" height="120" rx="20" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/>
      <text x="320" y="660" fill="#121317">LAYOUTS</text>
      <text x="320" y="692" font-size="18" font-weight="400" fill="#5f6976">LPage · LSection · LSidebar</text>

      <rect x="950" y="610" width="260" height="120" rx="20" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/>
      <text x="1080" y="660" fill="#121317">COMPONENTS</text>
      <text x="1080" y="692" font-size="18" font-weight="400" fill="#5f6976">CButton · CCard · CImage …</text>

      <rect x="500" y="790" width="400" height="70" rx="20" fill="#121317"/>
      <text x="700" y="834" fill="#ffffff">HTML + OPTIONAL FEATURE SCRIPTS</text>
    </g>

    <g stroke="#707b89" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M330 230h80"/>
      <path d="M660 230h80"/>
      <path d="M990 230h80"/>
      <path d="M1195 290v60c0 22-18 40-40 40h-105"/>
      <path d="M1050 510v50c0 28-22 50-50 50H840"/>
      <path d="M905 450H490c-95 0-170 75-170 160"/>
      <path d="M1050 510v100"/>
      <path d="M700 730v60"/>
      <path d="M320 730v45c0 28 22 50 50 50h130"/>
      <path d="M1080 730v45c0 28-22 50-50 50H900"/>
    </g>

    <g fill="#707b89">
      <path d="M399 222l14 8-14 8z"/>
      <path d="M729 222l14 8-14 8z"/>
      <path d="M1059 222l14 8-14 8z"/>
      <path d="M1042 382l8 14 8-14z"/>
      <path d="M832 602l14 8-14 8z"/>
      <path d="M312 598l8 14 8-14z"/>
      <path d="M1042 598l8 14 8-14z"/>
      <path d="M692 782l8 14 8-14z"/>
      <path d="M492 817l14 8-14 8z"/>
      <path d="M908 817l-14 8 14 8z"/>
    </g>

    <g font-size="17" fill="#65707f">
      <text x="700" y="560" text-anchor="middle">approved PageRegion contract</text>
      <text x="700" y="770" text-anchor="middle">render structure + UI</text>
    </g>
  </g>
</svg>
