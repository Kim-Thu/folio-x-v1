backend:
  name: github
  repo: Kim-Thu/folio-x-v1
  branch: main

local_backend: true

locale: vi
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: Cấu hình website
    label_singular: Cấu hình
    delete: false
    editor:
      preview: false
    files:
      - name: site
        label: Thông tin chung
        file: src/content/globals/site.json
        format: json
        fields:
          - label: Thông tin cá nhân
            name: site
            widget: object
            fields:
              - { label: Tên đầy đủ, name: name, widget: string }
              - { label: Tên viết tắt, name: shortName, widget: string }
              - { label: Vai trò, name: role, widget: string }
              - { label: Địa điểm, name: location, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Logo, name: logo, widget: image, required: false }
              - {
                  label: Logo sáng,
                  name: logoLight,
                  widget: image,
                  required: false,
                }
              - {
                  label: Logo tối,
                  name: logoDark,
                  widget: image,
                  required: false,
                }
              - {
                  label: Favicon,
                  name: favicon,
                  widget: image,
                  required: false,
                }
          - label: Metadata mặc định
            name: metadata
            widget: object
            fields:
              - { label: Ngôn ngữ, name: language, widget: string, default: vi }
              - { label: Tiêu đề SEO, name: title, widget: string }
              - { label: Mô tả SEO, name: description, widget: text }

      - name: navigation
        label: Điều hướng
        file: src/content/globals/navigation.json
        format: json
        fields:
          - label: Menu chính
            name: navItems
            widget: list
            fields: &navigation_fields
              - { label: Nhãn, name: label, widget: string }
              - { label: Đường dẫn, name: href, widget: string }
          - label: Menu chân trang
            name: footerNavItems
            widget: list
            fields: *navigation_fields
          - label: Resources
            name: resourceLinks
            widget: list
            fields: *navigation_fields
          - label: Liên kết pháp lý
            name: legalLinks
            widget: list
            fields: *navigation_fields
          - label: Mạng xã hội
            name: socialLinks
            widget: list
            fields:
              - { label: Tên mạng xã hội, name: label, widget: string }
              - { label: Nhãn viết tắt, name: shortLabel, widget: string }
              - {
                  label: Icon,
                  name: icon,
                  widget: select,
                  required: false,
                  options: [linkedin, github],
                }
              - { label: Đường dẫn, name: href, widget: string }

      - name: pages
        label: Pages
        files:
          - name: home
            label: Home
            file: src/content/pages/home.json
            format: json
            fields:
              - { label: Slug, name: slug, widget: string }
              - label: Meta
                name: meta
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text, required: false }
                  - { label: Author, name: author, widget: string, required: false }
                  - { label: Published at, name: publishedAt, widget: string, required: false }
                  - { label: Updated at, name: updatedAt, widget: string, required: false }
              - label: Content sections
                name: content
                widget: object
                fields:
                  - label: Sections
                    name: sections
                    widget: list
                    summary: "{{fields.id}} — {{fields.type}}"
                    fields:
                      - { label: ID, name: id, widget: string }
                      - { label: Type, name: type, widget: select, options: [hero, collection, cards, cta] }
                      - { label: Template, name: template, widget: string, required: false }
                      - { label: Settings, name: settings, widget: object, required: false, fields: [] }
                      - { label: Content, name: content, widget: object, required: false, fields: [] }
      - name: homepage_legacy
        label: Trang chủ
        file: src/content/pages/home.json
        format: json
        fields:
          - label: Header
            name: header
            widget: object
            fields:
              - { label: Tên thương hiệu, name: brand, widget: string }
              - { label: Nhãn liên hệ, name: contactLabel, widget: string }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: ID section, name: id, widget: string }
              - {
                  label: Template,
                  name: template,
                  widget: select,
                  options: [full-banner, split-image-right],
                  default: full-banner,
                }
              - label: Ảnh hero
                name: image
                widget: object
                fields: &image_fields
                  - { label: Ảnh, name: src, widget: image }
                  - { label: Mô tả ảnh, name: alt, widget: string }
                  - {
                      label: Chiều rộng,
                      name: width,
                      widget: number,
                      value_type: int,
                      min: 1,
                    }
                  - {
                      label: Chiều cao,
                      name: height,
                      widget: number,
                      value_type: int,
                      min: 1,
                    }
              - {
                  label: Dòng nhận diện,
                  name: identityLines,
                  widget: list,
                  field: { label: Dòng, name: line, widget: string },
                }
              - {
                  label: Nhãn breadcrumb,
                  name: breadcrumbLabel,
                  widget: string,
                }
              - {
                  label: Liên kết breadcrumb,
                  name: breadcrumbHomeLabel,
                  widget: string,
                }
              - {
                  label: Dòng địa điểm,
                  name: locationLines,
                  widget: list,
                  field: { label: Dòng, name: line, widget: string },
                }
              - {
                  label: Ký hiệu trạng thái,
                  name: statusSymbol,
                  widget: string,
                }
              - { label: Nội dung giới thiệu, name: summary, widget: text }
              - {
                  label: Tiêu đề,
                  name: titleLines,
                  widget: list,
                  field: { label: Dòng, name: line, widget: string },
                }
              - { label: Nhãn cuộn trang, name: scrollLabel, widget: string }
              - { label: Nhãn liên hệ, name: contactLabel, widget: string }
          - label: Giới thiệu
            name: about
            widget: object
            fields:
              - &section_heading
                label: Tiêu đề section
                name: heading
                widget: object
                fields:
                  - { label: ID section, name: id, widget: string }
                  - { label: Số thứ tự, name: number, widget: string }
                  - { label: Nhãn, name: label, widget: string }
                  - { label: Tiêu đề, name: title, widget: text }
                  - {
                      label: Mô tả,
                      name: description,
                      widget: text,
                      required: false,
                    }
              - {
                  label: Layout grid,
                  name: gridLayout,
                  widget: select,
                  options:
                    ["three-column", "twelve-column", "content-three-column"],
                  default: "content-three-column",
                }
              - {
                  label: Khoảng cách gap,
                  name: gridGap,
                  widget: select,
                  options: [none, sm, md, lg],
                  default: md,
                }
              - {
                  label: Template card,
                  name: cardTemplate,
                  widget: select,
                  options: [stacked, horizontal, overlay, featured],
                  default: overlay,
                }
              - {
                  label: Số cột,
                  name: gridColumns,
                  widget: number,
                  value_type: int,
                  min: 1,
                  max: 4,
                  default: 3,
                }
              - label: Vùng nội dung card
                name: cardSlots
                widget: object
                fields:
                  - {
                      label: Hiển thị ảnh,
                      name: media,
                      widget: boolean,
                      default: true,
                    }
                  - {
                      label: Hiển thị metadata,
                      name: meta,
                      widget: boolean,
                      default: true,
                    }
                  - {
                      label: Hiển thị tiêu đề,
                      name: title,
                      widget: boolean,
                      default: true,
                    }
                  - {
                      label: Hiển thị mô tả,
                      name: excerpt,
                      widget: boolean,
                      default: false,
                    }
                  - {
                      label: Hiển thị hành động trên card,
                      name: action,
                      widget: boolean,
                      default: true,
                    }
              - label: Nguyên tắc
                name: principles
                widget: list
                fields:
                  - { label: Số thứ tự, name: index, widget: string }
                  - { label: Đường dẫn, name: href, widget: string }
                  - {
                      label: Đường dẫn category,
                      name: categoryHref,
                      widget: string,
                    }
                  - { label: Nhãn, name: label, widget: string }
                  - {
                      label: Tiêu đề,
                      name: title,
                      widget: list,
                      field: { label: Dòng, name: line, widget: string },
                    }
                  - {
                      label: Mô tả,
                      name: description,
                      widget: text,
                      required: false,
                    }
                  - { label: Ảnh, name: image, widget: image }
                  - { label: Mô tả ảnh, name: imageAlt, widget: string }
                  - {
                      label: Chiều rộng ảnh,
                      name: imageWidth,
                      widget: number,
                      value_type: int,
                      min: 1,
                      default: 1200,
                    }
                  - {
                      label: Chiều cao ảnh,
                      name: imageHeight,
                      widget: number,
                      value_type: int,
                      min: 1,
                      default: 800,
                    }
              - label: Năng lực
                name: capability
                widget: object
                fields:
                  - { label: Nhãn, name: label, widget: string }
                  - { label: Nội dung chính, name: primary, widget: text }
                  - { label: Nội dung bổ sung, name: secondary, widget: text }
              - label: Nút xem thêm
                name: action
                widget: object
                fields:
                  - { label: Nhãn, name: label, widget: string }
          - label: Dự án nổi bật
            name: works
            widget: object
            fields:
              - *section_heading
              - { label: Nhãn kết quả, name: outcomeLabel, widget: string }
              - { label: Nhãn mở dự án, name: linkLabel, widget: string }
              - { label: Nhãn xem tất cả, name: archiveLabel, widget: string }
              - {
                  label: Số dự án xem trước,
                  name: previewLimit,
                  widget: number,
                  value_type: int,
                  min: 1,
                }
          - label: Bài viết nổi bật
            name: insights
            widget: object
            fields:
              - *section_heading
          - label: Hỏi đáp
            name: qa
            widget: object
            fields:
              - *section_heading
          - label: Danh sách câu hỏi
            name: faqs
            widget: list
            fields:
              - { label: Câu hỏi, name: question, widget: string }
              - { label: Câu trả lời, name: answer, widget: text }
          - label: Kêu gọi hành động
            name: cta
            widget: object
            fields:
              - { label: ID section, name: id, widget: string }
              - { label: Tiêu đề, name: title, widget: text }
              - { label: Mô tả, name: description, widget: text }
              - { label: Nhãn hành động, name: actionLabel, widget: string }
              - label: Hình ảnh
                name: image
                widget: object
                fields:
                  - { label: Tệp ảnh, name: src, widget: image }
                  - { label: Mô tả ảnh, name: alt, widget: string }
                  - {
                      label: Chiều rộng,
                      name: width,
                      widget: number,
                      value_type: int,
                    }
                  - {
                      label: Chiều cao,
                      name: height,
                      widget: number,
                      value_type: int,
                    }

      - name: closing_profile
        label: Kết trang cá nhân
        file: src/content/globals/closing-profile.json
        format: json
        fields:
          - { label: ID section, name: id, widget: string }
          - { label: Nhãn mở đầu, name: eyebrow, widget: string }
          - {
              label: Các dòng tên,
              name: nameLines,
              widget: list,
              field: { label: Dòng, name: line, widget: string },
            }
          - { label: Vai trò, name: roleLabel, widget: string }
          - label: Liên kết kết nối
            name: followAction
            widget: object
            fields:
              - { label: Nhãn, name: label, widget: string }
              - { label: Đường dẫn, name: href, widget: string }
          - { label: Nhãn email, name: emailActionLabel, widget: string }
          - { label: Nhãn địa điểm, name: locationLabel, widget: string }
          - label: Ảnh nhân vật theo trạng thái
            name: portraits
            widget: object
            required: false
            fields:
              - label: Trạng thái thu
                name: collapsed
                widget: object
                fields:
                  - { label: Ảnh, name: src, widget: image }
                  - { label: Mô tả ảnh, name: alt, widget: string }
                  - {
                      label: Chiều rộng gốc,
                      name: width,
                      widget: number,
                      value_type: int,
                      min: 1,
                    }
                  - {
                      label: Chiều cao gốc,
                      name: height,
                      widget: number,
                      value_type: int,
                      min: 1,
                    }
              - label: Trạng thái mở
                name: expanded
                widget: object
                fields:
                  - { label: Ảnh, name: src, widget: image }
                  - { label: Mô tả ảnh, name: alt, widget: string }
                  - {
                      label: Chiều rộng gốc,
                      name: width,
                      widget: number,
                      value_type: int,
                      min: 1,
                    }
                  - {
                      label: Chiều cao gốc,
                      name: height,
                      widget: number,
                      value_type: int,
                      min: 1,
                    }

      - name: interface
        label: Nội dung giao diện
        file: src/content/globals/interface.json
        format: json
        fields:
          - { label: Bỏ qua tới nội dung, name: skipToContent, widget: string }
          - { label: Về đầu trang, name: backToTop, widget: string }
          - { label: Mở menu, name: openMenu, widget: string }
          - label: Màn hình tải
            name: loadingScreen
            widget: object
            fields:
              - { label: Nhãn, name: label, widget: string }
              - { label: Trạng thái, name: status, widget: string }
              - label: Danh sách mẹo nhỏ
                name: tips
                widget: list
                field: { label: Mẹo, name: tip, widget: string }
              - {
                  label: Giữ màn hình để duyệt,
                  name: holdOpen,
                  widget: boolean,
                  default: false,
                }
              - { label: Nhãn tiến độ, name: progressLabel, widget: string }
              - label: Hình ảnh
                name: image
                widget: object
                fields:
                  - { label: Tệp ảnh, name: src, widget: image }
                  - { label: Mô tả ảnh, name: alt, widget: string }
                  - {
                      label: Chiều rộng,
                      name: width,
                      widget: number,
                      value_type: int,
                      min: 1,
                    }
                  - {
                      label: Chiều cao,
                      name: height,
                      widget: number,
                      value_type: int,
                      min: 1,
                    }
          - label: Nhãn điều hướng
            name: navigation
            widget: object
            fields:
              - { label: Menu chính, name: primaryLabel, widget: string }
              - { label: Menu mobile, name: mobileLabel, widget: string }
              - { label: Mạng xã hội, name: socialLabel, widget: string }
              - {
                  label: Mạng xã hội ở chân trang,
                  name: footerSocialLabel,
                  widget: string,
                }
              - {
                  label: Kiểu hiển thị social trên rail,
                  name: railSocialDisplay,
                  widget: select,
                  options: [label, shortLabel, icon],
                  default: shortLabel,
                }
          - label: Nhãn tiến trình
            name: progress
            widget: object
            fields:
              - { label: Thanh tiến trình, name: railLabel, widget: string }
              - { label: Tiến độ đọc, name: readingLabel, widget: string }
              - { label: Section ban đầu, name: initialSection, widget: string }
              - { label: Giá trị ban đầu, name: initialValue, widget: string }
          - label: Ký tự phân cách
            name: separators
            widget: object
            fields:
              - { label: Dấu gạch chéo, name: slash, widget: string }
              - { label: Dấu chấm giữa, name: dot, widget: string }
          - label: Định dạng nội dung
            name: contentFormatting
            widget: object
            fields:
              - {
                  label: Mẫu thời gian đọc,
                  name: readingTimeTemplate,
                  widget: string,
                  hint: "Dùng {minutes} tại vị trí cần chèn số phút.",
                }
              - {
                  label: Locale định dạng ngày,
                  name: dateLocale,
                  widget: string,
                  hint: "Ví dụ: vi-VN",
                }
      - name: archive
        label: Trang danh sách và chi tiết
        file: src/content/globals/archive.json
        format: json
        fields:
          - label: Danh sách dự án
            name: projects
            widget: object
            fields:
              - { label: Nhãn đầu mục, name: eyebrow, widget: string }
              - { label: Tiêu đề, name: title, widget: string }
              - {
                  label: Nhãn breadcrumb,
                  name: breadcrumbLabel,
                  widget: string,
                }
              - {
                  label: Nhãn trang chủ,
                  name: breadcrumbHomeLabel,
                  widget: string,
                }
              - {
                  label: Nhãn trang dự án,
                  name: breadcrumbProjectsLabel,
                  widget: string,
                }
              - {
                  label: Các dòng tiêu đề,
                  name: headingLines,
                  widget: list,
                  field: { label: Dòng, name: line, widget: string },
                }
              - { label: Mô tả, name: description, widget: text }
              - { label: Nhãn bộ lọc, name: filterLabel, widget: string }
              - { label: Nhãn tất cả, name: allLabel, widget: string }
              - {
                  label: Thông báo không có kết quả,
                  name: emptyLabel,
                  widget: text,
                }
              - { label: Nhãn quay lại, name: backLabel, widget: string }
              - {
                  label: Tiền tố danh mục,
                  name: categoryPrefix,
                  widget: string,
                }
              - { label: Tiền tố thẻ, name: tagPrefix, widget: string }
              - { label: Nhãn mở dự án, name: actionLabel, widget: string }
              - { label: Nhãn sắp xếp, name: sortLabel, widget: string }
              - label: Tùy chọn sắp xếp
                name: sortOptions
                widget: list
                fields:
                  - { label: Nhãn, name: label, widget: string }
                  - {
                      label: Giá trị,
                      name: value,
                      widget: select,
                      options: [featured, newest, oldest],
                    }
              - label: Ảnh hero
                name: heroImage
                widget: object
                required: false
                fields: *image_fields
              - { label: Nhãn kiểu hiển thị, name: viewLabel, widget: string }
              - { label: Nhãn lưới, name: gridViewLabel, widget: string }
              - { label: Nhãn danh sách, name: listViewLabel, widget: string }
              - {
                  label: Nhãn phân trang,
                  name: paginationLabel,
                  widget: string,
                }
              - {
                  label: Nhãn trang trước,
                  name: previousPageLabel,
                  widget: string,
                }
              - { label: Nhãn trang sau, name: nextPageLabel, widget: string }
              - {
                  label: Số project mỗi trang,
                  name: pageSize,
                  widget: number,
                  value_type: int,
                  min: 1,
                }
          - label: Danh sách bài viết
            name: blog
            widget: object
            fields:
              - { label: Nhãn đầu mục, name: eyebrow, widget: string }
              - { label: Tiêu đề, name: title, widget: string }
              - { label: Mô tả, name: description, widget: text }
              - { label: Nhãn bộ lọc, name: filterLabel, widget: string }
              - { label: Nhãn tất cả, name: allLabel, widget: string }
              - {
                  label: Thông báo không có kết quả,
                  name: emptyLabel,
                  widget: text,
                }
              - { label: Nhãn quay lại, name: backLabel, widget: string }
              - {
                  label: Tiền tố danh mục,
                  name: categoryPrefix,
                  widget: string,
                }
              - { label: Tiền tố thẻ, name: tagPrefix, widget: string }
          - label: Trang chi tiết
            name: detail
            widget: object
            fields:
              - {
                  label: Tổng quan dự án,
                  name: projectOverviewLabel,
                  widget: string,
                }
              - {
                  label: Kết quả dự án,
                  name: projectResultLabel,
                  widget: string,
                }
              - { label: Nhãn tác giả, name: articleByLabel, widget: string }
              - {
                  label: Nhãn ngày xuất bản,
                  name: articlePublishedLabel,
                  widget: string,
                }
              - { label: Nhãn thẻ, name: tagsLabel, widget: string }
              - label: Họa tiết Page Header
                name: pageHeaderPattern
                widget: object
                fields: *image_fields
              - { label: Tính năng, name: featuresLabel, widget: string }
              - { label: Thư viện ảnh, name: galleryLabel, widget: string }
              - { label: Công nghệ, name: techStackLabel, widget: string }
              - {
                  label: Đánh giá khách hàng,
                  name: testimonialLabel,
                  widget: string,
                }
              - { label: Khách hàng, name: clientLabel, widget: string }
              - { label: Vai trò, name: roleLabel, widget: string }
              - { label: Thời gian, name: durationLabel, widget: string }
              - { label: Mục lục, name: onThisPageLabel, widget: string }
              - { label: Xem website, name: liveActionLabel, widget: string }
              - { label: Xem mã nguồn, name: sourceActionLabel, widget: string }
              - { label: Dự án trước, name: previousLabel, widget: string }
              - { label: Dự án tiếp theo, name: nextLabel, widget: string }

      - name: footer
        label: Chân trang
        file: src/content/globals/footer.json
        format: json
        fields:
          - { label: Brand description, name: brandDescription, widget: text }
          - {
              label: Social display,
              name: socialDisplay,
              widget: select,
              options: [label, shortLabel, icon],
              default: icon,
            }
          - { label: Resources heading, name: resourcesLabel, widget: string }
          - label: Newsletter
            name: newsletter
            widget: object
            fields:
              - { label: Heading, name: label, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Email label, name: inputLabel, widget: string }
              - { label: Placeholder, name: placeholder, widget: string }
              - { label: Submit label, name: submitLabel, widget: string }
          - { label: Tiêu đề menu, name: menuLabel, widget: string }
          - { label: Tiêu đề pháp lý, name: legalLabel, widget: string }
          - { label: Tiêu đề địa điểm, name: locationLabel, widget: string }
          - { label: Ký hiệu bản quyền, name: copyrightSymbol, widget: string }
          - { label: Nhãn công nghệ, name: buildLabel, widget: string }

      - name: system_states
        label: Trang trạng thái hệ thống
        file: src/content/globals/system-states.json
        format: json
        fields:
          - &system_state
            label: Trang 404
            name: notFound
            widget: object
            fields: &system_state_fields
              - { label: ID tiêu đề, name: id, widget: string }
              - {
                  label: Mã hiển thị,
                  name: displayCode,
                  widget: string,
                  required: false,
                }
