backend:
  name: github
  repo: Kim-Thu/folio-x-v1
  branch: main

local_backend: true

locale: vi
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: Cấu hình website
    label_singular: Cấu hình
    delete: false
    editor:
      preview: false
    files:
      - name: site
        label: Thông tin chung
        file: src/content/globals/site.json
        format: json
        fields:
          - label: Thông tin cá nhân
            name: site
            widget: object
            fields:
              - { label: Tên đầy đủ, name: name, widget: string }
              - { label: Tên viết tắt, name: shortName, widget: string }
              - { label: Vai trò, name: role, widget: string }
              - { label: Địa điểm, name: location, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Logo, name: logo, widget: image, required: false }
              - { label: Logo sáng, name: logoLight, widget: image, required: false }
              - { label: Logo tối, name: logoDark, widget: image, required: false }
              - { label: Favicon, name: favicon, widget: image, required: false }
              - { label: Nhãn liên hệ, name: contactLabel, widget: string }
          - label: Metadata mặc định
            name: metadata
            widget: object
            fields:
              - { label: Ngôn ngữ, name: language, widget: string }
              - { label: Tiêu đề SEO, name: title, widget: string }
              - { label: Mô tả SEO, name: description, widget: text }

      - name: navigation
        label: Điều hướng
        file: src/content/globals/navigation.json
        format: json
        fields:
          - label: Menu chính
            name: navItems
            widget: list
            fields: &navigation_fields
              - { label: Nhãn, name: label, widget: string }
              - { label: Đường dẫn, name: href, widget: string }
          - label: Menu chân trang
            name: footerNavItems
            widget: list
            fields: *navigation_fields
          - label: Resources
            name: resourceLinks
            widget: list
            fields: *navigation_fields
          - label: Liên kết pháp lý
            name: legalLinks
            widget: list
            fields: *navigation_fields
          - label: Mạng xã hội
            name: socialLinks
            widget: list
            fields:
              - { label: Tên mạng xã hội, name: label, widget: string }
              - { label: Nhãn viết tắt, name: shortLabel, widget: string }
              - { label: Icon, name: icon, widget: select, required: false, options: [linkedin, github] }
              - { label: Đường dẫn, name: href, widget: string }

      - name: pages
        label: Pages
        files:
          - name: home
            label: Home
            file: src/content/pages/home.json
            format: json
            fields:
              - { label: Slug, name: slug, widget: string }
              - label: Meta
                name: meta
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text, required: false }
                  - { label: Author, name: author, widget: string, required: false }
                  - { label: Published at, name: publishedAt, widget: string, required: false }
                  - { label: Updated at, name: updatedAt, widget: string, required: false }
              - { label: SEO override, name: seo, widget: object, required: false, fields: [] }
              - label: Content
                name: content
                widget: object
                fields:
                  - label: Layout
                    name: layout
                    widget: object
                    fields:
                      - { label: Template, name: template, widget: select, options: [fluid, contained, boxed, sidebar, centered] }
                      - { label: Container size, name: containerSize, widget: select, required: false, options: [site, content] }
                      - { label: Aside label, name: asideLabel, widget: string, required: false }
                      - { label: Aside position, name: asidePosition, widget: select, required: false, options: [start, end] }
                  - label: Sections
                    name: sections
                    widget: list
                    summary: "{{fields.id}} — {{fields.type}}"
                    types:
                      - label: Hero
                        name: hero
                        widget: object
                        fields:
                          - { label: ID, name: id, widget: string }
                          - { label: Type, name: type, widget: hidden, default: hero }
                          - { label: Template, name: template, widget: string }
                          - label: Settings
                            name: settings
                            widget: object
                            fields: &section_settings
                              - { label: Theme, name: theme, widget: select, options: [dark, light, canvas, accent, none] }
                              - { label: Spacing, name: spacing, widget: select, options: [compact, default, none, lead, body, closing] }
                              - { label: Container, name: container, widget: select, options: [site, content, none] }
                              - { label: Layout, name: layout, widget: string, required: false }
                              - { label: Columns, name: columns, widget: number, required: false, value_type: int, min: 1 }
                              - { label: Gap, name: gap, widget: string, required: false }
                              - { label: Media ratio, name: mediaRatio, widget: string, required: false }
                              - { label: Separator, name: separator, widget: string, required: false }
                          - label: Content
                            name: content
                            widget: object
                            fields:
                              - { label: Content ID, name: id, widget: string, required: false }
                              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
                              - { label: Title, name: title, widget: list, field: { label: Dòng, name: line, widget: string } }
                              - { label: Accent, name: accent, widget: string, required: false }
                              - { label: Description, name: description, widget: text, required: false }
                              - label: Image
                                name: image
                                widget: object
                                required: false
                                fields: &image_fields
                                  - { label: Ảnh, name: src, widget: image }
                                  - { label: Alt, name: alt, widget: string }
                                  - { label: Width, name: width, widget: number, value_type: int, min: 1 }
                                  - { label: Height, name: height, widget: number, value_type: int, min: 1 }
                              - label: Actions
                                name: actions
                                widget: list
                                required: false
                                fields: &action_fields
                                  - { label: Href, name: href, widget: string }
                                  - { label: Label, name: label, widget: string }
                                  - { label: Icon, name: icon, widget: string, required: false }
                                  - { label: Icon position, name: iconPosition, widget: select, required: false, options: [start, end] }
                                  - { label: Variant, name: variant, widget: string, required: false }
                                  - { label: Tone, name: tone, widget: string, required: false }
                                  - { label: Size, name: size, widget: string, required: false }
                              - { label: Actions label, name: actionsLabel, widget: string, required: false }
                              - { label: Scroll label, name: scrollLabel, widget: string, required: false }
                      - label: Collection
                        name: collection
                        widget: object
                        fields:
                          - { label: ID, name: id, widget: string }
                          - { label: Type, name: type, widget: hidden, default: collection }
                          - { label: Template, name: template, widget: string, required: false }
                          - label: Settings
                            name: settings
                            widget: object
                            fields: *section_settings
                          - label: Content
                            name: content
                            widget: object
                            fields:
                              - label: Heading
                                name: heading
                                widget: object
                                required: false
                                fields:
                                  - { label: Number, name: number, widget: string, required: false }
                                  - { label: Label, name: label, widget: string, required: false }
                                  - { label: Title, name: title, widget: list, field: { label: Dòng, name: line, widget: string } }
                                  - { label: Description, name: description, widget: text, required: false }
                                  - label: Action
                                    name: action
                                    widget: object
                                    required: false
                                    fields: *action_fields
                              - label: Source
                                name: source
                                widget: object
                                required: false
                                fields:
                                  - { label: Collection, name: collection, widget: select, options: [products, projects, labs, blog, comics, novels, publications] }
                                  - { label: Limit, name: limit, widget: number, required: false, value_type: int, min: 1 }
                              - { label: Static items, name: items, widget: list, required: false, fields: [] }
                              - { label: Item presentation, name: itemPresentation, widget: object, required: false, fields: [] }
                              - { label: Cards, name: cards, widget: object, required: false, fields: [] }
                      - label: CTA
                        name: cta
                        widget: object
                        fields:
                          - { label: ID, name: id, widget: string }
                          - { label: Type, name: type, widget: hidden, default: cta }
                          - { label: Template, name: template, widget: string }
                          - label: Settings
                            name: settings
                            widget: object
                            fields: *section_settings
                          - label: Content
                            name: content
                            widget: object
                            fields:
                              - { label: Title, name: title, widget: string }
                              - { label: Description, name: description, widget: text, required: false }
                              - label: Action
                                name: action
                                widget: object
                                required: false
                                fields: *action_fields
                              - label: Image
                                name: image
                                widget: object
                                required: false
                                fields: *image_fields

      - name: interface
        label: Giao diện hệ thống
        file: src/content/globals/interface.json
        format: json
        fields:
          - { label: Skip to content, name: skipToContent, widget: string }
          - { label: Back to top, name: backToTop, widget: string }
          - { label: Open menu, name: openMenu, widget: string }
          - { label: Close menu, name: closeMenu, widget: string }
          - label: Loading screen
            name: loadingScreen
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Status, name: status, widget: string }
              - { label: Tips, name: tips, widget: list, field: { label: Tip, name: tip, widget: string } }
              - { label: Hold open, name: holdOpen, widget: boolean }
              - { label: Progress label, name: progressLabel, widget: string }
              - label: Image
                name: image
                widget: object
                fields: *image_fields
          - label: Navigation labels
            name: navigation
            widget: object
            fields:
              - { label: Primary label, name: primaryLabel, widget: string }
              - { label: Mobile label, name: mobileLabel, widget: string }
              - { label: Social label, name: socialLabel, widget: string }
              - { label: Footer social label, name: footerSocialLabel, widget: string }
              - { label: Rail social display, name: railSocialDisplay, widget: select, options: [label, shortLabel, icon] }
          - label: Progress
            name: progress
            widget: object
            fields:
              - { label: Rail label, name: railLabel, widget: string }
              - { label: Reading label, name: readingLabel, widget: string }
              - { label: Initial section, name: initialSection, widget: string }
              - { label: Initial value, name: initialValue, widget: string }
          - label: Separators
            name: separators
            widget: object
            fields:
              - { label: Slash, name: slash, widget: string }
              - { label: Dot, name: dot, widget: string }
          - label: Content formatting
            name: contentFormatting
            widget: object
            fields:
              - { label: Reading time template, name: readingTimeTemplate, widget: string }
              - { label: Date locale, name: dateLocale, widget: string }

      - name: footer
        label: Chân trang
        file: src/content/globals/footer.json
        format: json
        fields:
          - { label: Brand description, name: brandDescription, widget: text }
          - { label: Social display, name: socialDisplay, widget: select, options: [label, shortLabel, icon] }
          - { label: Menu label, name: menuLabel, widget: string }
          - { label: Resources label, name: resourcesLabel, widget: string }
          - { label: Legal label, name: legalLabel, widget: string }
          - { label: Location label, name: locationLabel, widget: string }
          - { label: Copyright symbol, name: copyrightSymbol, widget: string }
          - { label: Build label, name: buildLabel, widget: string }
          - label: Newsletter
            name: newsletter
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Input label, name: inputLabel, widget: string }
              - { label: Placeholder, name: placeholder, widget: string }
              - { label: Submit label, name: submitLabel, widget: string }

      - name: system_states
        label: Trạng thái hệ thống
        file: src/content/globals/system-states.json
        format: json
        fields:
          - label: Not found
            name: notFound
            widget: object
            fields: &system_state_fields
              - { label: ID, name: id, widget: string }
              - { label: Display code, name: displayCode, widget: string, required: false }
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Primary action
                name: primaryAction
                widget: object
                fields:
                  - { label: Href, name: href, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Icon, name: icon, widget: string, required: false }
              - label: Secondary action
                name: secondaryAction
                widget: object
                required: false
                fields:
                  - { label: Href, name: href, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Icon, name: icon, widget: string, required: false }
              - label: Image
                name: image
                widget: object
                fields: *image_fields
              - { label: Metadata title, name: metadataTitle, widget: string }
              - { label: Metadata description, name: metadataDescription, widget: text }
          - label: Empty state
            name: empty
            widget: object
            fields: *system_state_fields

      - name: closing_profile
        label: Kết trang cá nhân
        file: src/content/globals/closing-profile.json
        format: json
        fields:
          - { label: ID section, name: id, widget: string }
          - { label: Nhãn mở đầu, name: eyebrow, widget: string }
          - { label: Các dòng tên, name: nameLines, widget: list, field: { label: Dòng, name: line, widget: string } }
          - { label: Vai trò, name: roleLabel, widget: string }
          - label: Liên kết kết nối
            name: followAction
            widget: object
            fields:
              - { label: Nhãn, name: label, widget: string }
              - { label: Đường dẫn, name: href, widget: string }
          - { label: Nhãn email, name: emailActionLabel, widget: string }
          - { label: Nhãn địa điểm, name: locationLabel, widget: string }
          - label: Ảnh nhân vật theo trạng thái
            name: portraits
            widget: object
            required: false
            fields:
              - label: Trạng thái thu
                name: collapsed
                widget: object
                fields: *image_fields
              - label: Trạng thái mở
                name: expanded
                widget: object
                fields: *image_fields

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: slug
    summary: "{{title}} — {{year}}"
    fields:
      - { label: Order, name: order, widget: number, value_type: int, min: 1 }
      - { label: Slug, name: slug, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Category, name: category, widget: string }
      - { label: Category slug, name: categorySlug, widget: string }
      - { label: Year, name: year, widget: string }
      - { label: Tone, name: tone, widget: select, options: [light, dark] }
      - { label: Outcome, name: outcome, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Image alt, name: alt, widget: string, required: false }
      - label: Tags
        name: tags
        widget: list
        fields: &taxonomy_term_fields
          - { label: Label, name: label, widget: string }
          - { label: Slug, name: slug, widget: string }
      - label: Detail
        name: detail
        widget: object
        required: false
        fields:
          - { label: Role, name: role, widget: string, required: false }
          - { label: Duration, name: duration, widget: string, required: false }
          - { label: Live URL, name: liveUrl, widget: string, required: false }
          - { label: Source URL, name: sourceUrl, widget: string, required: false }
          - label: Features
            name: features
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Icon, name: icon, widget: string }
          - label: Gallery
            name: gallery
            widget: list
            required: false
            fields: *image_fields
          - label: Results
            name: results
            widget: list
            required: false
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          - label: Testimonial
            name: testimonial
            widget: object
            required: false
            fields:
              - { label: Quote, name: quote, widget: text }
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
          - label: Reviews
            name: reviews
            widget: object
            required: false
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - label: Summary
                name: summary
                widget: object
                fields:
                  - { label: Score, name: score, widget: number, value_type: float }
                  - { label: Maximum, name: maximum, widget: number, value_type: float }
                  - { label: Total label, name: totalLabel, widget: string }
                  - label: Distribution
                    name: distribution
                    widget: list
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Value, name: value, widget: number, value_type: float }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Date, name: date, widget: string }
                  - { label: Quote, name: quote, widget: text }
                  - { label: Rating, name: rating, widget: number, value_type: float }
          - label: Page
            name: page
            widget: object
            fields:
              - { label: Template, name: template, widget: select, options: [fluid, contained, boxed, sidebar, centered] }
              - label: Sections
                name: sections
                widget: list
                summary: "{{fields.id}} — {{fields.type}}"
                types:
                  - label: Project header
                    name: project_header
                    widget: object
                    fields:
                      - { label: ID, name: id, widget: string }
                      - { label: Type, name: type, widget: hidden, default: page-header }
                      - { label: Template, name: template, widget: string }
                      - label: Settings
                        name: settings
                        widget: object
                        fields: *section_settings
                      - label: Content
                        name: content
                        widget: object
                        fields:
                          - label: Back action
                            name: backAction
                            widget: object
                            fields:
                              - { label: Label, name: label, widget: string }
                              - { label: Href, name: href, widget: string }
                          - { label: Gallery label, name: galleryLabel, widget: string }
                          - { label: Previous image label, name: previousImageLabel, widget: string }
                          - { label: Next image label, name: nextImageLabel, widget: string }
                          - { label: Tags label, name: tagsLabel, widget: string }
                          - { label: Actions label, name: actionsLabel, widget: string }
                          - { label: Live action label, name: liveActionLabel, widget: string }
                          - { label: Source action label, name: sourceActionLabel, widget: string }
                          - label: Aside decoration
                            name: asideDecoration
                            widget: object
                            required: false
                            fields: *image_fields
                          - label: Facts
                            name: facts
                            widget: object
                            fields:
                              - { label: Client label, name: clientLabel, widget: string }
                              - { label: Role label, name: roleLabel, widget: string }
                              - { label: Duration label, name: durationLabel, widget: string }
                  - label: Article
                    name: article
                    widget: object
                    fields:
                      - { label: ID, name: id, widget: string }
                      - { label: Type, name: type, widget: hidden, default: article }
                      - { label: Template, name: template, widget: string, required: false }
                      - label: Settings
                        name: settings
                        widget: object
                        fields: *section_settings
                      - label: Content
                        name: content
                        widget: object
                        fields:
                          - { label: Source, name: source, widget: string }
                  - label: Reviews
                    name: reviews
                    widget: object
                    fields:
                      - { label: ID, name: id, widget: string }
                      - { label: Type, name: type, widget: hidden, default: reviews }
                      - { label: Template, name: template, widget: string, required: false }
                      - label: Settings
                        name: settings
                        widget: object
                        fields: *section_settings
                      - label: Content
                        name: content
                        widget: object
                        fields:
                          - { label: Source, name: source, widget: string }
                  - label: Post navigation
                    name: post_navigation
                    widget: object
                    fields:
                      - { label: ID, name: id, widget: string }
                      - { label: Type, name: type, widget: hidden, default: post-navigation }
                      - { label: Template, name: template, widget: string, required: false }
                      - label: Settings
                        name: settings
                        widget: object
                        fields: *section_settings
                      - label: Content
                        name: content
                        widget: object
                        fields:
                          - { label: Label, name: label, widget: string }
                          - { label: Previous label, name: previousLabel, widget: string }
                          - { label: Next label, name: nextLabel, widget: string }

  - name: labs
    label: Labs
    label_singular: Lab
    folder: src/content/labs
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: slug
    summary: "{{title}} — {{statusLabel}}"
    fields:
      - { label: Order, name: order, widget: number, value_type: int, min: 1 }
      - { label: Slug, name: slug, widget: string }
      - { label: Title, name: title, widget: string }
      - label: Category
        name: category
        widget: object
        fields: *taxonomy_term_fields
      - { label: Status, name: status, widget: select, options: [experiment, in-progress, complete] }
      - { label: Status label, name: statusLabel, widget: string }
      - { label: Summary, name: summary, widget: text }
      - label: Image
        name: image
        widget: object
        fields: *image_fields
      - label: Technologies
        name: technologies
        widget: list
        fields: *taxonomy_term_fields
      - { label: Stars, name: stars, widget: number, value_type: int, min: 0 }
      - { label: Forks, name: forks, widget: number, value_type: int, min: 0 }
      - { label: Updated label, name: updatedLabel, widget: string }
      - { label: Live URL, name: liveUrl, widget: string, required: false }
      - { label: Source URL, name: sourceUrl, widget: string, required: false }
      - label: Sections
        name: sections
        widget: list
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
      - label: Features
        name: features
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Icon, name: icon, widget: select, options: [lightBulb, bolt, globeAlt, arrowPath] }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        fields: *image_fields
      - label: Resources
        name: resources
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Href, name: href, widget: string }
          - { label: Icon, name: icon, widget: select, options: [folder01, github, play] }
      - label: Facts
        name: facts
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Value, name: value, widget: string }
      - label: Detail
        name: detail
        widget: object
        required: false
        fields:
          - label: Page
            name: page
            widget: object
            fields:
              - { label: Template, name: template, widget: select, options: [fluid, contained, boxed, sidebar, centered] }
              - label: Sections
                name: sections
                widget: list
                summary: "{{fields.id}} — {{fields.type}}"
                types:
                  - label: Lab header
                    name: lab_header
                    widget: object
                    fields:
                      - { label: ID, name: id, widget: string }
                      - { label: Type, name: type, widget: hidden, default: page-header }
                      - { label: Template, name: template, widget: string }
                      - label: Settings
                        name: settings
                        widget: object
                        fields: *section_settings
                      - label: Content
                        name: content
                        widget: object
                        fields:
                          - label: Labels
                            name: labels
                            widget: object
                            fields:
                              - { label: Breadcrumb, name: breadcrumb, widget: string }
                              - { label: Actions, name: actions, widget: string }
                              - { label: Live, name: live, widget: string }
                              - { label: Source, name: source, widget: string }
                              - { label: Technology, name: technology, widget: string }
                  - label: Article
                    name: article
                    widget: object
                    fields:
