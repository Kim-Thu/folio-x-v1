                          slider-aside,
                          split-benefits,
                          gallery-summary,
                          cover-summary,
                          media-aside,
                          stacked,
                          horizontal,
                          overlay,
                          featured,
                          boxed,
                          compact-media,
                          compact-bordered,
                          media-details,
                          media-summary,
